[project]
name = "media_summarizer"
version = "0.1.0"
description = "Service de résumé automatique de podcasts utilisant l'IA"
authors = [
    {name = "Media Summarizer Team"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "mangum>=0.17.0",
    "aiohttp>=3.9.0",
    "aioboto3>=15.0.0",
    "boto3>=1.38.23",
    "botocore>=1.38.23,<1.38.28",
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "email-validator>=2.0.0",
    "langdetect>=1.0.9",
    "yt-dlp",
    "fsrs>=1.0.0",
    "algoliasearch>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
worker = [
    # Article extraction runs only in the shared asynchronous worker image.
    "trafilatura>=1.12.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Keep worker modules importable for local checks and the existing test suite.
    "trafilatura>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_summarizer"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 135
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes (unused imports, variables, etc.)
# I: isort (import sorting)
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Research scripts: line-length and dead code less critical
"docs/research/**/*.py" = ["E501", "F841"]
# Test files can have longer lines for readability
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Per-module overrides: scoped, explicit suppressions with justifications
# Goal: make mypy exit 0 without weakening the gate via blanket ignores

[[tool.mypy.overrides]]
# S3 utility: "Missing return statement" from async functions that raise instead of return,
# plus assignment type variance from boto3 typing
module = "media_summarizer.utils.s3"
disable_error_code = ["return", "assignment"]

[[tool.mypy.overrides]]
# API endpoints with legacy/deprecated model attributes and FastAPI cookie arg types
module = [
    "media_summarizer.api.endpoints.feeds",
    "media_summarizer.api.endpoints.auth",
    "media_summarizer.api.endpoints.auth_social",
    "media_summarizer.api.endpoints.users",
    "media_summarizer.api.endpoints.tags",
    "media_summarizer.api.endpoints.podcasts",
    "media_summarizer.api.endpoints.media",
    "media_summarizer.api.endpoints.media_items",
]
disable_error_code = ["return", "call-arg", "arg-type", "assignment", "dict-item", "operator"]

[[tool.mypy.overrides]]
# FastAPI error handler signature variance (known FastAPI/Starlette type issue)
# and OpenAPI schema patching (method-assign on app.openapi_schema)
module = "media_summarizer.api.main"
disable_error_code = ["arg-type", "method-assign"]

[[tool.mypy.overrides]]
# Workers: accessing legacy ProcessingJob attributes and handling optional message fields
module = [
    "media_summarizer.workers.youtube_ingestion_worker",
    "media_summarizer.workers.tiktok_ingestion_worker",
    "media_summarizer.workers.x_ingestion_worker",
    "media_summarizer.workers.transcription.deepgram_worker",
    "media_summarizer.workers.events.media_completed_worker",
    "media_summarizer.workers.document_parsing.worker",
    "media_summarizer.workers.base_worker",
    "media_summarizer.workers.podcast_platform_resolvers",
    "media_summarizer.workers.artifact_generator.worker",
]
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
# Core services: mixed type annotations and optional handling
module = [
    "media_summarizer.core.services.folder_service",
    "media_summarizer.core.services.raw_content_service",
    "media_summarizer.core.services.bug_report_service",
    "media_summarizer.core.services.tag_service",
    "media_summarizer.core.services.fsrs_service",
    "media_summarizer.core.services.artifact_service",
    "media_summarizer.core.services.media_submission",
    "media_summarizer.core.services.__init__",
]
disable_error_code = ["var-annotated", "annotation-unchecked", "no-redef", "union-attr", "attr-defined", "return-value", "arg-type", "assignment"]

[[tool.mypy.overrides]]
# Utils: DynamoDB Decimal types, optional handling, legacy code
module = [
    "media_summarizer.utils.logging_config",
    "media_summarizer.utils.auth_utils",
    "media_summarizer.utils.rss_transcript",
    "media_summarizer.utils.podcast_index",
    "media_summarizer.utils.database_async",
    "media_summarizer.utils.digest_db",
    "media_summarizer.utils.quota_usage_db",
    "media_summarizer.utils.user_media_submissions",
]
disable_error_code = ["union-attr", "arg-type", "assignment", "var-annotated", "annotation-unchecked", "attr-defined"]

[[tool.mypy.overrides]]
# Models: DynamoDB serialization and legacy attributes
module = [
    "media_summarizer.core.models.review_schedule",
    "media_summarizer.core.models.processing_job",
]
disable_error_code = ["arg-type", "attr-defined", "assignment"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end integration tests against AWS dev (skipped by default; run via `pytest -m e2e`)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not e2e'"
