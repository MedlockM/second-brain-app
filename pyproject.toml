[project]
name = "media_summarizer"
version = "0.1.0"
description = "Service de résumé automatique de podcasts utilisant l'IA"
authors = [
    {name = "Media Summarizer Team"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "aioboto3>=15.0.0",
    "boto3>=1.38.23",
    "botocore>=1.38.23,<1.38.28",
    "openai>=1.3.0",
    "openai-whisper>=20231117",
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "email-validator>=2.0.0",
    "docker>=6.1.0",
    "slowapi>=0.1.8",
    "redis>=5.0.0",
    "Jinja2>=3.1.3",
    "trafilatura>=1.12.0",
    "youtube-transcript-api",
    "yt-dlp",
    "fsrs>=1.0.0",
    "algoliasearch>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "requests>=2.31.0",
    "docker>=6.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_summarizer"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
