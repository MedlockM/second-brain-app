[project]
name = "media_summarizer"
version = "0.1.0"
description = "Service de résumé automatique de podcasts utilisant l'IA"
authors = [
    {name = "Media Summarizer Team"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "mangum>=0.17.0",
    "aioboto3>=15.0.0",
    "boto3>=1.38.23",
    "botocore>=1.38.23,<1.38.28",
    "openai>=1.3.0",
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "email-validator>=2.0.0",
    "Jinja2>=3.1.3",
    "trafilatura>=1.12.0",
    "langdetect>=1.0.9",
    "yt-dlp",
    "fsrs>=1.0.0",
    "algoliasearch>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_summarizer"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 135
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes (unused imports, variables, etc.)
# I: isort (import sorting)
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Research and archive scripts: line-length and dead code less critical
"docs/research/**/*.py" = ["E501", "F841"]
"scripts/archive/**/*.py" = ["E501", "E741", "F841"]
# Test files can have longer lines for readability
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end integration tests against AWS dev (skipped by default; run via `pytest -m e2e`)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not e2e'"
