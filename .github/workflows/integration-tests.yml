name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of tests to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - component
          - workflow
          - fast
          - slow

env:
  PYTHON_VERSION: "3.12"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  setup:
    name: Setup and Validation
    runs-on: ubuntu-latest
    outputs:
      run-component: ${{ steps.determine-tests.outputs.run-component }}
      run-workflow: ${{ steps.determine-tests.outputs.run-workflow }}
      test-matrix: ${{ steps.determine-tests.outputs.test-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine test scope
        id: determine-tests
        run: |
          if [[ "${{ github.event.inputs.test_type }}" == "component" ]]; then
            echo "run-component=true" >> $GITHUB_OUTPUT
            echo "run-workflow=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.test_type }}" == "workflow" ]]; then
            echo "run-component=false" >> $GITHUB_OUTPUT
            echo "run-workflow=true" >> $GITHUB_OUTPUT
          else
            echo "run-component=true" >> $GITHUB_OUTPUT
            echo "run-workflow=true" >> $GITHUB_OUTPUT
          fi

          # Create test matrix for parallel execution
          echo 'test-matrix=["rss", "download", "transcription", "summarization", "email"]' >> $GITHUB_OUTPUT

      - name: Validate Docker Compose
        run: |
          docker-compose -f docker-compose.dev.yml config --quiet

  component-tests:
    name: Component Tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run-component == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.test-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo ".venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=test
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_DEFAULT_REGION=us-east-1
          AWS_ENDPOINT_URL=http://localhost:4566
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          STRIPE_TEST_API_KEY=${{ secrets.STRIPE_TEST_API_KEY }}
          TEST_ENVIRONMENT=component
          TEST_WORKERS=stopped
          EOF

      - name: Start infrastructure services
        run: |
          docker-compose -f docker-compose.dev.yml --profile infrastructure up -d

          # Wait for LocalStack to be ready
          timeout 60 bash -c 'until curl -s http://localhost:4566/health > /dev/null; do sleep 2; done'

          # Additional wait for services initialization
          sleep 10

      - name: Verify infrastructure
        run: |
          curl -f http://localhost:4566/health
          docker-compose -f docker-compose.dev.yml ps

      - name: Run component tests for ${{ matrix.component }}
        run: |
          pytest \
            media_summarizer/tests/integration/components/test_worker_components.py::TestWorkerComponents::test_${{ matrix.component }}_worker_component \
            -v \
            --tb=short \
            --test-env=component \
            --workers=stopped \
            -m "component and not slow" \
            --cov=media_summarizer \
            --cov-report=xml:coverage-${{ matrix.component }}.xml \
            --cov-report=term

      - name: Run slow component tests for ${{ matrix.component }} (if applicable)
        if: matrix.component == 'transcription' || github.event.inputs.test_type == 'slow'
        run: |
          pytest \
            media_summarizer/tests/integration/components/test_worker_components.py::TestWorkerComponents::test_${{ matrix.component }}_worker_component \
            -v \
            --tb=short \
            --test-env=component \
            --workers=stopped \
            -m "component and slow" \
            --cov=media_summarizer \
            --cov-report=xml:coverage-${{ matrix.component }}-slow.xml \
            --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage-${{ matrix.component }}.xml
          flags: component-${{ matrix.component }}
          name: component-${{ matrix.component }}

      - name: Store test logs
        if: failure()
        run: |
          mkdir -p test-logs
          docker-compose -f docker-compose.dev.yml logs > test-logs/docker-logs-${{ matrix.component }}.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ matrix.component }}
          path: test-logs/

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.dev.yml down -v

  workflow-tests:
    name: Workflow Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run-workflow == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo ".venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=test
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_DEFAULT_REGION=us-east-1
          AWS_ENDPOINT_URL=http://localhost:4566
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          STRIPE_TEST_API_KEY=${{ secrets.STRIPE_TEST_API_KEY }}
          TEST_ENVIRONMENT=workflow
          TEST_WORKERS=required
          EOF

      - name: Start full stack
        run: |
          # Start infrastructure first
          docker-compose -f docker-compose.dev.yml --profile infrastructure up -d

          # Wait for LocalStack
          timeout 60 bash -c 'until curl -s http://localhost:4566/health > /dev/null; do sleep 2; done'

          # Start workers
          docker-compose -f docker-compose.dev.yml --profile workers up -d

          # Wait for workers to initialize
          sleep 15

      - name: Verify full stack
        run: |
          curl -f http://localhost:4566/health
          docker-compose -f docker-compose.dev.yml ps

          # Verify workers are running
          docker-compose -f docker-compose.dev.yml ps | grep -E "(download-worker|whisper)"

      - name: Run workflow tests - Credit Management
        run: |
          pytest \
            media_summarizer/tests/integration/workflows/test_credit_management_workflow.py \
            -v \
            --tb=short \
            --test-env=workflow \
            --workers=required \
            -m "workflow" \
            --cov=media_summarizer \
            --cov-report=xml:coverage-workflow-credit.xml

      - name: Run workflow tests - Podcast Submission
        run: |
          pytest \
            media_summarizer/tests/integration/workflows/test_podcast_submission_workflow.py \
            -v \
            --tb=short \
            --test-env=workflow \
            --workers=required \
            -m "workflow or not workflow" \
            --cov=media_summarizer \
            --cov-report=xml:coverage-workflow-submission.xml

      - name: Run workflow tests - Full Pipeline
        run: |
          pytest \
            media_summarizer/tests/integration/workflows/test_podcast_workflow_integration.py \
            -v \
            --tb=short \
            --test-env=workflow \
            --workers=required \
            --cov=media_summarizer \
            --cov-report=xml:coverage-workflow-pipeline.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage-workflow-*.xml
          flags: workflow
          name: workflow-tests

      - name: Store test logs
        if: failure()
        run: |
          mkdir -p test-logs
          docker-compose -f docker-compose.dev.yml logs > test-logs/docker-logs-workflow.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-workflow
          path: test-logs/

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.dev.yml down -v

  transcription-full-tests:
    name: Transcription Tests (Full Whisper)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run-component == 'true' && (github.event.inputs.test_type == 'slow' || github.event.inputs.test_type == 'all')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo ".venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=test
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_DEFAULT_REGION=us-east-1
          AWS_ENDPOINT_URL=http://localhost:4566
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          STRIPE_TEST_API_KEY=${{ secrets.STRIPE_TEST_API_KEY }}
          TEST_ENVIRONMENT=component
          TEST_WORKERS=stopped
          EOF

      - name: Start infrastructure and Whisper
        run: |
          docker-compose -f docker-compose.dev.yml --profile infrastructure up -d
          docker-compose -f docker-compose.dev.yml --profile whisper up -d

          # Wait for services
          timeout 60 bash -c 'until curl -s http://localhost:4566/health > /dev/null; do sleep 2; done'
          sleep 20  # Extra time for Whisper model loading

      - name: Run transcription tests with real Whisper
        run: |
          pytest \
            media_summarizer/tests/integration/components/test_worker_components.py::TestWorkerComponents::test_transcription_worker_component \
            -v \
            --tb=short \
            --test-env=component \
            --workers=stopped \
            -m "component and requires_whisper" \
            --cov=media_summarizer \
            --cov-report=xml:coverage-transcription-full.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage-transcription-full.xml
          flags: component-transcription-full
          name: component-transcription-full

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.dev.yml down -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [setup, component-tests, workflow-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Setup: ${{ needs.setup.result }}"
          echo "Component Tests: ${{ needs.component-tests.result }}"
          echo "Workflow Tests: ${{ needs.workflow-tests.result }}"

          if [[ "${{ needs.component-tests.result }}" == "failure" ]] || [[ "${{ needs.workflow-tests.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          elif [[ "${{ needs.component-tests.result }}" == "skipped" ]] && [[ "${{ needs.workflow-tests.result }}" == "skipped" ]]; then
            echo "⚠️ All tests were skipped"
            exit 1
          else
            echo "✅ All tests passed or were skipped as expected"
          fi

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: [component-tests, workflow-tests, transcription-full-tests]
    if: always()

    steps:
      - name: Cleanup Docker resources
        run: |
          # Clean up any remaining containers/networks
          docker system prune -f

      - name: Report cleanup
        run: echo "✅ Cleanup completed"
