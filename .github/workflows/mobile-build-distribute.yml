name: Mobile Build & Distribute

# ---------------------------------------------------------------------------
# TRIGGER CONTRACT — revised 2026-08-13
#
# This workflow spends EAS build quota and can push binaries to TestFlight and
# Google Play Internal Testing. It therefore has exactly two entry points:
#
#   1. Push of a `mobile-v*` tag  -> production build on both platforms,
#                                    followed by `eas submit` to both stores.
#                                    This is the release path documented in
#                                    docs/PRODUCTION_RELEASE_RUNBOOK.md.
#   2. `workflow_dispatch`        -> whatever the operator asks for. Defaults
#                                    are deliberately harmless: `preview`
#                                    profile, `submit=false`. Submitting to a
#                                    store from a manual run requires ticking
#                                    `submit` explicitly.
#
# A push to a branch (including `main`) builds NOTHING. Until 2026-08-13 the
# `push` block mixed `branches: [main]` + `paths: [mobile/**]` with
# `tags: [mobile-v*]`; GitHub treats those as two independent triggers, not as a
# conjunction, so every commit touching `mobile/` fired a production build on
# both platforms and an unattended store submission. Static mobile checks on
# `main` live in pr.yml / main.yml (typecheck + lint); nothing here needs to run
# per-commit. Do not re-add a branch filter to the `push` trigger.
#
# Owner prerequisite: the `EXPO_TOKEN` repository secret must exist, otherwise
# every `eas` call fails with "An Expo user account is required to proceed".
# Both build jobs assert it in their first step. See mobile/MOBILE_CI_CD.md.
# ---------------------------------------------------------------------------

permissions:
  contents: read

on:
  push:
    # Tags only — no `branches:` here, on purpose (see the contract above).
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      submit:
        description: "Submit to the store after build (TestFlight / Play internal)"
        required: true
        default: false
        type: boolean

env:
  # Node 22+, not 20: eas-cli 22 bundles typescript 7, which no longer exposes
  # `transpileModule`. `@expo/require-utils` then falls back to Node's
  # `module.stripTypeScriptTypes`, which only exists from Node 22 -- without it
  # `app.config.ts` is evaluated as plain JS and every eas command dies on
  # "Missing initializer in const declaration".
  NODE_VERSION: "22"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # -------------------------------------------------------------------
  # iOS Build & TestFlight Distribution
  # -------------------------------------------------------------------
  ios-build:
    name: iOS Build & TestFlight
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'
    timeout-minutes: 60
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      # Fail here rather than 10 steps later inside `eas build`.
      - name: Require EXPO_TOKEN
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::error::EXPO_TOKEN secret is empty. Create a robot token at" \
                 "https://expo.dev/settings/access-tokens then run" \
                 "'gh secret set EXPO_TOKEN'. Every eas command in this workflow" \
                 "needs it (see mobile/MOBILE_CI_CD.md)."
            exit 1
          fi
          echo "EXPO_TOKEN is present."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Resolve build profile and submit flag
        id: plan
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Operator-chosen. Defaults are preview + no submit.
            PROFILE="${{ github.event.inputs.profile }}"
            SUBMIT="${{ github.event.inputs.submit }}"
          else
            # Only reachable on a `mobile-v*` tag push: the release path.
            PROFILE="production"
            SUBMIT="true"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "submit=$SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved profile=$PROFILE submit=$SUBMIT"

      - name: Run EAS Build for iOS
        id: build
        working-directory: mobile
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform ios \
            --profile ${{ steps.plan.outputs.profile }} \
            --non-interactive \
            --json \
            --no-wait)
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "## iOS Build Started" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`$BUILD_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ steps.plan.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- Submit after build: ${{ steps.plan.outputs.submit }}" >> $GITHUB_STEP_SUMMARY

      - name: Wait for iOS build to complete
        working-directory: mobile
        run: |
          echo "Waiting for build ${{ steps.build.outputs.build_id }} to complete..."
          eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status'
          # Poll until complete (EAS CLI handles this with --wait in newer versions)
          while true; do
            STATUS=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            echo "Build status: $STATUS"
            if [[ "$STATUS" == "finished" ]]; then
              echo "build_status=success" >> $GITHUB_ENV
              break
            elif [[ "$STATUS" == "errored" || "$STATUS" == "canceled" ]]; then
              echo "build_status=failed" >> $GITHUB_ENV
              echo "::error::iOS build failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # Belt and braces: even if someone re-adds a branch trigger, a store
      # submission stays reserved to `mobile-v*` tags and manual dispatch.
      - name: Submit to TestFlight
        if: >-
          env.build_status == 'success' &&
          steps.plan.outputs.submit == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           startsWith(github.ref, 'refs/tags/mobile-v'))
        working-directory: mobile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --non-interactive \
            --id ${{ steps.build.outputs.build_id }}
          echo "## iOS TestFlight Submission" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Submitted" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`${{ steps.build.outputs.build_id }}\`" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # Android Build & Internal Testing Distribution
  # -------------------------------------------------------------------
  android-build:
    name: Android Build & Internal Testing
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'
    timeout-minutes: 60
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      # Fail here rather than 10 steps later inside `eas build`.
      - name: Require EXPO_TOKEN
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::error::EXPO_TOKEN secret is empty. Create a robot token at" \
                 "https://expo.dev/settings/access-tokens then run" \
                 "'gh secret set EXPO_TOKEN'. Every eas command in this workflow" \
                 "needs it (see mobile/MOBILE_CI_CD.md)."
            exit 1
          fi
          echo "EXPO_TOKEN is present."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Resolve build profile and submit flag
        id: plan
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Operator-chosen. Defaults are preview + no submit.
            PROFILE="${{ github.event.inputs.profile }}"
            SUBMIT="${{ github.event.inputs.submit }}"
          else
            # Only reachable on a `mobile-v*` tag push: the release path.
            PROFILE="production"
            SUBMIT="true"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "submit=$SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved profile=$PROFILE submit=$SUBMIT"

      - name: Write Google Play service account key
        working-directory: mobile
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > google-services-key.json

      - name: Run EAS Build for Android
        id: build
        working-directory: mobile
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile ${{ steps.plan.outputs.profile }} \
            --non-interactive \
            --json \
            --no-wait)
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "## Android Build Started" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`$BUILD_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ steps.plan.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- Submit after build: ${{ steps.plan.outputs.submit }}" >> $GITHUB_STEP_SUMMARY

      - name: Wait for Android build to complete
        working-directory: mobile
        run: |
          echo "Waiting for build ${{ steps.build.outputs.build_id }} to complete..."
          while true; do
            STATUS=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            echo "Build status: $STATUS"
            if [[ "$STATUS" == "finished" ]]; then
              echo "build_status=success" >> $GITHUB_ENV
              break
            elif [[ "$STATUS" == "errored" || "$STATUS" == "canceled" ]]; then
              echo "build_status=failed" >> $GITHUB_ENV
              echo "::error::Android build failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done

      # Belt and braces: even if someone re-adds a branch trigger, a store
      # submission stays reserved to `mobile-v*` tags and manual dispatch.
      - name: Submit to Google Play Internal Testing
        if: >-
          env.build_status == 'success' &&
          steps.plan.outputs.submit == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           startsWith(github.ref, 'refs/tags/mobile-v'))
        working-directory: mobile
        run: |
          eas submit \
            --platform android \
            --profile production \
            --non-interactive \
            --id ${{ steps.build.outputs.build_id }}
          echo "## Android Internal Testing Submission" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Submitted" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`${{ steps.build.outputs.build_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Clean up service account key
        if: always()
        working-directory: mobile
        run: rm -f google-services-key.json

  # -------------------------------------------------------------------
  # Build Failure Notification
  # -------------------------------------------------------------------
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ios-build, android-build]
    if: failure()
    # Needed by `gh issue create` below; everything else stays read-only.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Determine failed jobs
        id: failures
        run: |
          FAILED_JOBS=""
          if [[ "${{ needs.ios-build.result }}" == "failure" ]]; then
            FAILED_JOBS="iOS"
          fi
          if [[ "${{ needs.android-build.result }}" == "failure" ]]; then
            if [[ -n "$FAILED_JOBS" ]]; then
              FAILED_JOBS="$FAILED_JOBS, Android"
            else
              FAILED_JOBS="Android"
            fi
          fi
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

      - name: Post failure summary
        run: |
          echo "## Build Distribution FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed platforms:** ${{ steps.failures.outputs.failed_jobs }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Action Required" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the failed job logs above for error details" >> $GITHUB_STEP_SUMMARY
          echo "2. See \`mobile/MOBILE_CI_CD.md\` for troubleshooting guidance" >> $GITHUB_STEP_SUMMARY
          echo "3. Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "   - Missing \`EXPO_TOKEN\` repository secret" >> $GITHUB_STEP_SUMMARY
          echo "   - Expired signing certificates (iOS)" >> $GITHUB_STEP_SUMMARY
          echo "   - Invalid service account key (Android)" >> $GITHUB_STEP_SUMMARY
          echo "   - EAS build quota exceeded" >> $GITHUB_STEP_SUMMARY
          echo "   - App version conflict in store" >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": ":x: Mobile build distribution failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Mobile Build Distribution Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Failed Platforms:*\n${{ steps.failures.outputs.failed_jobs }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Ref:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }'

      # Only labels that actually exist in the repository may be passed here:
      # `gh issue create` hard-fails on an unknown label, which used to make the
      # failure-notification job fail and hide the real build failure. As of
      # 2026-08-13 the repo only has the 9 GitHub defaults (`gh label list`), so
      # `bug` is the single label used. Create a `ci/cd` label first if you want
      # it back.
      - name: Create GitHub Issue for persistent failures
        # `push` now only ever means a `mobile-v*` release tag, i.e. exactly the
        # case worth an issue. Manual dispatch failures stay in the run summary.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI: mobile build distribution failed on ${{ github.ref_name }}" \
            --body "## Build Failure

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Failed platforms:** ${{ steps.failures.outputs.failed_jobs }}
          **Release tag:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}

          Please investigate the failed build logs and resolve the issue.

          See \`mobile/MOBILE_CI_CD.md\` for troubleshooting guidance." \
            --label "bug"

  # -------------------------------------------------------------------
  # Success Summary
  # -------------------------------------------------------------------
  distribute-summary:
    name: Distribution Summary
    runs-on: ubuntu-latest
    needs: [ios-build, android-build]
    if: success()

    steps:
      - name: Post success summary
        run: |
          echo "## Mobile Distribution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Build ID |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | \`${{ needs.ios-build.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | \`${{ needs.android-build.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Store submission only happened if this run was a \`mobile-v*\` tag" >> $GITHUB_STEP_SUMMARY
          echo "or a manual dispatch with \`submit=true\` — check the submission" >> $GITHUB_STEP_SUMMARY
          echo "steps above before telling testers a new build is coming." >> $GITHUB_STEP_SUMMARY
