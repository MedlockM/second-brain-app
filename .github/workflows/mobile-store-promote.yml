name: Mobile Store Promotion

# This workflow promotes a build from internal testing to production store tracks.
# It is triggered manually after internal testing validation is complete.
# See docs/PRODUCTION_RELEASE_RUNBOOK.md for the full release process.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to promote"
        required: true
        type: choice
        options:
          - ios
          - android
          - all
      android_rollout_percentage:
        description: "Android staged rollout percentage (10-100)"
        required: false
        default: "10"
        type: string
      ios_release_type:
        description: "iOS release type after approval"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - automatic

env:
  # Node 22+, not 20: eas-cli 22 bundles typescript 7, which no longer exposes
  # `transpileModule`. `@expo/require-utils` then falls back to Node's
  # `module.stripTypeScriptTypes`, which only exists from Node 22 -- without it
  # `app.config.ts` is evaluated as plain JS and every eas command dies on
  # "Missing initializer in const declaration".
  NODE_VERSION: "22"
  # Pinned, never bare `eas-cli`. This workflow relies on `build:list
  # --buildProfile --status finished --limit --json --non-interactive` returning
  # an array whose first element carries `id`/`appVersion`/`appBuildVersion`, and
  # on `submit --non-interactive --id` taking `ascAppId` from eas.json. Verified
  # against 22.0.0 on 2026-09-03, which is also what the owner's machine runs.
  # 23.2.0 is already published; bump this deliberately after re-reading
  # `--help`, not by drifting to latest.
  EAS_CLI_VERSION: "22.0.0"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # -------------------------------------------------------------------
  # iOS: Submit to App Store Review (Production)
  # -------------------------------------------------------------------
  ios-promote:
    name: iOS - Submit to App Store Review
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI ${{ env.EAS_CLI_VERSION }}
        run: npm install -g "eas-cli@${EAS_CLI_VERSION}"

      - name: Get latest production build
        id: build
        working-directory: mobile
        run: |
          BUILD_INFO=$(eas build:list \
            --platform ios \
            --buildProfile production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive)
          BUILD_ID=$(echo "$BUILD_INFO" | jq -r '.[0].id')
          BUILD_VERSION=$(echo "$BUILD_INFO" | jq -r '.[0].appVersion')
          BUILD_NUMBER=$(echo "$BUILD_INFO" | jq -r '.[0].appBuildVersion')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "## iOS Production Submission" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`$BUILD_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: $BUILD_VERSION ($BUILD_NUMBER)" >> $GITHUB_STEP_SUMMARY

      - name: Submit to App Store (production)
        working-directory: mobile
        # No Apple env vars here, on purpose. `eas.json` used to carry
        # "ascAppId": "${ASC_APP_ID}" and friends, but @expo/eas-json only
        # interpolates ascApiKeyPath/ascApiKeyIssuerId/ascApiKeyId in a submit
        # profile — appleId, ascAppId and appleTeamId are passed through
        # verbatim, so `${...}` reached the validator and failed it. Apple-side
        # auth comes from the App Store Connect API key stored on the EAS
        # servers. See mobile/MOBILE_CI_CD.md, "Submit Profiles".
        #
        # `--non-interactive` additionally requires a literal `ascAppId` in the
        # submit profile ("Set ascAppId in the submit profile (eas.json) or
        # re-run this command in interactive mode"). It is hardcoded in eas.json
        # since 2026-09-01; keep it literal, it has no env-var equivalent.
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --non-interactive \
            --id ${{ steps.build.outputs.build_id }}
          echo "- Status: Submitted for App Store Review" >> $GITHUB_STEP_SUMMARY

      - name: Post summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to App Store Connect to verify submission" >> $GITHUB_STEP_SUMMARY
          echo "2. Set release type: ${{ github.event.inputs.ios_release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor review status (typically 24-48h)" >> $GITHUB_STEP_SUMMARY
          echo "4. Update docs/RELEASE_LOG.md with timeline" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # Android: Promote to Production Track
  # -------------------------------------------------------------------
  android-promote:
    name: Android - Promote to Production Track
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI ${{ env.EAS_CLI_VERSION }}
        run: npm install -g "eas-cli@${EAS_CLI_VERSION}"

      - name: Write Google Play service account key
        working-directory: mobile
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > google-services-key.json

      - name: Get latest production build
        id: build
        working-directory: mobile
        run: |
          BUILD_INFO=$(eas build:list \
            --platform android \
            --buildProfile production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive)
          BUILD_ID=$(echo "$BUILD_INFO" | jq -r '.[0].id')
          BUILD_VERSION=$(echo "$BUILD_INFO" | jq -r '.[0].appVersion')
          BUILD_CODE=$(echo "$BUILD_INFO" | jq -r '.[0].appBuildVersion')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "build_code=$BUILD_CODE" >> $GITHUB_OUTPUT
          echo "## Android Production Promotion" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`$BUILD_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: $BUILD_VERSION ($BUILD_CODE)" >> $GITHUB_STEP_SUMMARY

      - name: Submit to Google Play Production
        working-directory: mobile
        run: |
          eas submit \
            --platform android \
            --non-interactive \
            --id ${{ steps.build.outputs.build_id }} \
            --latest
          echo "- Rollout: ${{ github.event.inputs.android_rollout_percentage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Submitted to production track" >> $GITHUB_STEP_SUMMARY

      - name: Clean up service account key
        if: always()
        working-directory: mobile
        run: rm -f google-services-key.json

      - name: Post summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Google Play Console to set rollout to ${{ github.event.inputs.android_rollout_percentage }}%" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor crash rate in Play Console" >> $GITHUB_STEP_SUMMARY
          echo "3. Increase rollout per schedule in docs/PRODUCTION_RELEASE_RUNBOOK.md" >> $GITHUB_STEP_SUMMARY
          echo "4. Update docs/RELEASE_LOG.md with timeline" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # Summary
  # -------------------------------------------------------------------
  promotion-summary:
    name: Promotion Summary
    runs-on: ubuntu-latest
    needs: [ios-promote, android-promote]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Store Promotion Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.ios-promote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.android-promote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Reminder" >> $GITHUB_STEP_SUMMARY
          echo "- Update \`docs/RELEASE_LOG.md\` with the promotion timestamp" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor store review status over next 24-48 hours" >> $GITHUB_STEP_SUMMARY
          echo "- Follow rollback procedures in \`docs/PRODUCTION_RELEASE_RUNBOOK.md\` if issues arise" >> $GITHUB_STEP_SUMMARY
