name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy media_summarizer

      - name: Guard — no orphaned completion-event queue name (task-143)
        run: |
          if grep -rn --include="*.py" --include="*.tf" -e "episode-completion-events" -e "EPISODE_COMPLETION_EVENTS_QUEUE" media_summarizer infrastructure/terraform; then
            echo "::error::Dead queue name resurfaced. Producers and consumer must converge on 'episode-completed-events' / EPISODE_COMPLETED_EVENTS_QUEUE (see task-143)."
            exit 1
          fi

      - name: Guard — no resurrected per-kind artifact queues (task-195)
        run: |
          if grep -rn --include="*.py" --include="*.tf" \
            -e "flashcards-queue" -e "notes-queue" -e "quiz-queue" \
            -e "summarization-queue" -e "summary-short-queue" -e "summary-detailed-queue" \
            media_summarizer infrastructure/terraform; then
            echo "::error::Dead per-kind artifact queue name resurfaced. All artifact types route to artifact-generator-queue (see task-195)."
            exit 1
          fi

  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint
