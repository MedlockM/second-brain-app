name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install from uv.lock, not from the pyproject ranges. `pip install -e
      # ".[dev]"` re-resolved every run, so CI could lint with a different ruff
      # or mypy than the one pinned in the lock and the one the owner runs
      # locally. The same drift on `fastapi>=0.104.0` took dev down (see the
      # comment in infrastructure/docker/lambda-api.Dockerfile).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy media_summarizer

      - name: Guard — no orphaned completion-event queue name (task-143)
        run: |
          if grep -rn --include="*.py" --include="*.tf" -e "episode-completion-events" -e "EPISODE_COMPLETION_EVENTS_QUEUE" media_summarizer infrastructure/terraform; then
            echo "::error::Dead queue name resurfaced. Producers and consumer must converge on 'episode-completed-events' / EPISODE_COMPLETED_EVENTS_QUEUE (see task-143)."
            exit 1
          fi

      - name: Guard — no resurrected per-kind artifact queues (task-195)
        run: |
          if grep -rn --include="*.py" --include="*.tf" \
            -e "flashcards-queue" -e "notes-queue" -e "quiz-queue" \
            -e "summarization-queue" -e "summary-short-queue" -e "summary-detailed-queue" \
            media_summarizer infrastructure/terraform; then
            echo "::error::Dead per-kind artifact queue name resurfaced. All artifact types route to artifact-generator-queue (see task-195)."
            exit 1
          fi

      - name: Guard — single writer of the user_media TTL (task-243)
        run: python scripts/check_purge_at_writers.py

      - name: Guard — every env var used by the app is in .env.example
        run: python scripts/check_env_example_complete.py

  # A Terraform-only change used to be checked by nothing at all: ruff and mypy do not
  # read .tf files, deploy-lambda.yml does not filter on infrastructure/terraform/**,
  # and nothing ran fmt, validate or plan. A typo reached the account, or did not reach
  # it at all — either way the first signal was a human running plan by hand (task-341).
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Exact, and the same pin as .github/workflows/terraform-dev.yml. `latest`
          # would let a future 2.x satisfy `required_version = ">= 1.9"` and change the
          # CLI under the checks.
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      # `-backend=false` is what lets prod and staging be checked from a pull request:
      # validate needs neither credentials nor state, so no prod identity is involved
      # anywhere in this job. It still parses the whole config and type-checks every
      # expression, module call and provider argument.
      #
      # modules/platform is in the list even though it declares no backend and no
      # provider: `terraform plan` there is meant to fail, but validate is exactly the
      # command that does work on a bare module, and it is where most of the code is.
      - name: Validate every root and the shared module
        run: |
          for ROOT in envs/dev envs/prod envs/staging shared modules/platform; do
            echo "::group::$ROOT"
            terraform -chdir="infrastructure/terraform/$ROOT" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/$ROOT" validate
            echo "::endgroup::"
          done

  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint
