# Build Lambda container image and deploy all Lambda functions on push to main.
# Architecture: ARM64/Graviton2 container images via ECR.

name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - "media_summarizer/**"
      - "pyproject.toml"
      - "infrastructure/docker/lambda.Dockerfile"
      - ".github/workflows/deploy-lambda.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: media-summarizer-lambda
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/lambda.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:worker-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:worker-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update API Lambda function
        run: |
          aws lambda update-function-code \
            --function-name media-summarizer-api \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ env.IMAGE_TAG }}" \
            --no-cli-pager

      - name: Update worker Lambda functions
        run: |
          WORKERS=(
            podcastindex_resolution
            article_extraction
            x_ingestion
            youtube_ingestion
            tiktok_ingestion
            download
            deepgram_transcription
            summarization
            document_parsing
            search_indexing
            rss_feed_poll
            media_completed_events
            flashcards
            notes
          )
          for worker in "${WORKERS[@]}"; do
            echo "Updating media-summarizer-worker-${worker}..."
            aws lambda update-function-code \
              --function-name "media-summarizer-worker-${worker}" \
              --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:worker-${{ env.IMAGE_TAG }}" \
              --no-cli-pager
          done

      - name: Wait for API Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name media-summarizer-api

      - name: Smoke test API (invoke with empty event)
        run: |
          # Simple health check via Lambda invoke
          aws lambda invoke \
            --function-name media-summarizer-api \
            --payload '{"httpMethod":"GET","path":"/api/v1/health","headers":{},"queryStringParameters":null,"body":null,"requestContext":{"http":{"method":"GET","path":"/api/v1/health"}},"version":"2.0","routeKey":"$default","rawPath":"/api/v1/health","isBase64Encoded":false}' \
            --no-cli-pager \
            /tmp/response.json
          cat /tmp/response.json
