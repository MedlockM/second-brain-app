# Build and deploy independent ARM64 Lambda images for the interactive API and
# the shared asynchronous workers. Lambda updates always use content digests;
# latest tags exist only to bootstrap new Terraform environments.

name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - "media_summarizer/**"
      - "pyproject.toml"
      # uv.lock, not just pyproject.toml: both Dockerfiles `COPY pyproject.toml
      # uv.lock` and install from the lock, so the pinned versions -- not the
      # pyproject ranges -- are what ends up in the image. A `uv lock
      # --upgrade-package X` touches this file alone, and without it here that
      # bump deployed nothing while CI and the owner's machine both linted
      # against the new version.
      - "uv.lock"
      - "infrastructure/docker/lambda-api.Dockerfile"
      - "infrastructure/docker/lambda.Dockerfile"
      - ".github/workflows/deploy-lambda.yml"
  # Production is never deployed automatically. It is promoted, by hand, from an
  # image a push to main already built and validated in dev.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag suffix to promote to production: a git SHA already built by a main deploy, or 'latest'. The api-<tag> and worker-<tag> images must both exist in the shared registry."
        required: true
        default: latest

env:
  AWS_DEFAULT_REGION: eu-west-3
  ECR_REPOSITORY: media-summarizer-lambda
  IMAGE_TAG: ${{ github.sha }}
  # The one registry, in the dev/management account, shared by every environment
  # (shared/ecr.tf). Prod pulls from here cross-account so that the digest it runs
  # is the digest validated in dev.
  ECR_REGISTRY_ACCOUNT_ID: "125313707865"
  # Which environment a push to main deploys. Every AWS lookup below is scoped by
  # this value: a name-based or prefix-based lookup would hit whichever
  # environment happens to match.
  DEPLOY_ENVIRONMENT: dev

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect affected runtimes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'media_summarizer/api/**'
              - 'media_summarizer/core/**'
              - 'media_summarizer/utils/**'
              - 'media_summarizer/infrastructure/resolvers/**'
              - 'media_summarizer/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'infrastructure/docker/lambda-api.Dockerfile'
              - '.github/workflows/deploy-lambda.yml'
            workers:
              - 'media_summarizer/workers/**'
              - 'media_summarizer/core/**'
              - 'media_summarizer/utils/**'
              - 'media_summarizer/infrastructure/**'
              - 'media_summarizer/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'infrastructure/docker/lambda.Dockerfile'
              - '.github/workflows/deploy-lambda.yml'

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push dedicated API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/lambda-api.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=lambda-api
          cache-to: type=gha,mode=max,scope=lambda-api

      - name: Deploy API by immutable digest
        run: |
          # The function is media-summarizer-api-<env> since task-237; the
          # unsuffixed name no longer exists in the account.
          API_FUNCTION="media-summarizer-api-${DEPLOY_ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "$API_FUNCTION" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-api.outputs.digest }}" \
            --no-cli-pager
          aws lambda wait function-updated-v2 \
            --function-name "$API_FUNCTION"
          API_STATE=$(aws lambda get-function-configuration \
            --function-name "$API_FUNCTION" \
            --query 'State' \
            --output text)
          API_UPDATE=$(aws lambda get-function-configuration \
            --function-name "$API_FUNCTION" \
            --query 'LastUpdateStatus' \
            --output text)
          test "$API_STATE" = "Active"
          test "$API_UPDATE" = "Successful"

  deploy-workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push shared worker image
        id: build-workers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/lambda.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:worker-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:worker-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=lambda-workers
          cache-to: type=gha,mode=max,scope=lambda-workers

      - name: Deploy workers by immutable digest
        run: |
          # Discover workers by Environment tag, NOT by name prefix. The old
          # `starts_with(FunctionName, 'media-summarizer-worker-')` wildcard now
          # matches every environment's workers at once, so it would push this
          # image to staging — and later to production — on a push to main.
          WORKERS=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filters lambda:function \
            --tag-filters "Key=Environment,Values=${DEPLOY_ENVIRONMENT}" \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text \
            | tr '\t' '\n' \
            | awk -F: '$NF ~ /^media-summarizer-worker-/ { print $NF }')
          test -n "$WORKERS" || { echo "No media-summarizer-worker-* functions tagged Environment=${DEPLOY_ENVIRONMENT}"; exit 1; }
          # Fail loudly if the tag filter ever returns another environment's
          # function: silently deploying across environments is the failure this
          # step exists to prevent.
          for FUNCTION_NAME in $WORKERS; do
            case "$FUNCTION_NAME" in
              *-"${DEPLOY_ENVIRONMENT}") ;;
              *) echo "Refusing to deploy: $FUNCTION_NAME is not a ${DEPLOY_ENVIRONMENT} function"; exit 1 ;;
            esac
          done
          echo "Deploying to: $(echo "$WORKERS" | tr '\n' ' ')"
          for FUNCTION_NAME in $WORKERS; do
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-workers.outputs.digest }}" \
              --no-cli-pager
          done
          for FUNCTION_NAME in $WORKERS; do
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            WORKER_STATE=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --query 'State' \
              --output text)
            WORKER_UPDATE=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)
            test "$WORKER_STATE" = "Active"
            test "$WORKER_UPDATE" = "Successful"
          done

  release-validation:
    needs: [changes, deploy-api, deploy-workers]
    if: >-
      always() &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.workers == 'true') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Wait for API and validate public health endpoint
        run: |
          API_FUNCTION="media-summarizer-api-${DEPLOY_ENVIRONMENT}"
          aws lambda wait function-active-v2 \
            --function-name "$API_FUNCTION"
          API_STATE=$(aws lambda get-function-configuration \
            --function-name "$API_FUNCTION" \
            --query 'State' \
            --output text)
          API_UPDATE=$(aws lambda get-function-configuration \
            --function-name "$API_FUNCTION" \
            --query 'LastUpdateStatus' \
            --output text)
          test "$API_STATE" = "Active"
          test "$API_UPDATE" = "Successful"
          # Resolve the endpoint by API id, not by name. API Gateway names are not
          # unique across environments, so `Items[?Name=='media-summarizer-api']
          # .ApiEndpoint | [0]` picked one non-deterministically: the gate could
          # pass by health-checking a different environment than the one just
          # deployed. The Environment tag is the source of truth.
          API_ARN=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filters apigateway \
            --tag-filters "Key=Environment,Values=${DEPLOY_ENVIRONMENT}" \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '/apis/[^/]+$' \
            | head -1)
          test -n "$API_ARN" || { echo "No API Gateway tagged Environment=${DEPLOY_ENVIRONMENT}"; exit 1; }
          API_ID="${API_ARN##*/}"
          API_ENDPOINT=$(aws apigatewayv2 get-api \
            --api-id "$API_ID" \
            --query 'ApiEndpoint' \
            --output text)
          test -n "$API_ENDPOINT"
          test "$API_ENDPOINT" != "None"
          echo "Health-checking ${DEPLOY_ENVIRONMENT} API $API_ID"
          HEALTH_BODY=$(mktemp)
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output "$HEALTH_BODY" \
            "$API_ENDPOINT/api/health/"
          jq -e '.status == "healthy"' "$HEALTH_BODY"

  # ---------------------------------------------------------------------------
  # Production. Manual, and a PROMOTION rather than a build: it re-points the
  # prod functions at an image digest that a push to main already built, pushed
  # and health-checked in dev. Nothing is compiled here, so there is no way for
  # prod to run bytes that never existed in dev.
  #
  # Two independent reasons this job cannot touch dev:
  #
  #   1. `environment: production` makes GitHub mint an OIDC token whose `sub` is
  #      repo:<owner>/<repo>:environment:production. The dev deploy role's trust
  #      policy only accepts repo:<owner>/<repo>:ref:refs/heads/main, so this job
  #      cannot assume the dev role even if handed its ARN. Conversely the jobs
  #      above declare no environment, so they can never mint the production
  #      subject the prod role requires.
  #   2. The prod role lives in account 866874944541 and every ARN in its policy
  #      is an 866874944541 ARN. There is no dev resource it can name.
  #
  # AWS_DEPLOY_ROLE_ARN must be an *environment* secret of `production` (a
  # repository secret would be readable by the dev jobs too). The account-id
  # assertion below is what turns a forgotten environment secret into an
  # immediate failure instead of a confusing one.
  # ---------------------------------------------------------------------------
  promote-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ENVIRONMENT: prod
      PROMOTE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Assert the assumed identity is the prod account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Assumed role in account $ACCOUNT"
          test "$ACCOUNT" = "866874944541" || {
            echo "Refusing to continue: expected the prod account 866874944541."
            echo "AWS_DEPLOY_ROLE_ARN is probably missing from the 'production' GitHub environment,"
            echo "so the repository-level (dev) value was used instead."
            exit 1
          }

      - name: Resolve the digests to promote
        id: digests
        run: |
          # Digests, never tags: a tag is a pointer and prod must run the exact
          # bytes dev validated. describe-images is a cross-account read against
          # the shared registry, allowed by ConsumerAccountImagePull in
          # shared/ecr.tf plus EcrPullSharedRepository in the prod role.
          for KIND in api worker; do
            DIGEST=$(aws ecr describe-images \
              --registry-id "$ECR_REGISTRY_ACCOUNT_ID" \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${KIND}-${PROMOTE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            test -n "$DIGEST" && test "$DIGEST" != "None" || {
              echo "No image tagged ${KIND}-${PROMOTE_TAG} in the shared registry"; exit 1; }
            echo "${KIND}=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "${KIND}-${PROMOTE_TAG} -> ${DIGEST}"
          done

      - name: Promote the API image
        run: |
          REGISTRY="${ECR_REGISTRY_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          API_FUNCTION="media-summarizer-api-${DEPLOY_ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "$API_FUNCTION" \
            --image-uri "${REGISTRY}/${ECR_REPOSITORY}@${{ steps.digests.outputs.api }}" \
            --no-cli-pager
          aws lambda wait function-updated-v2 --function-name "$API_FUNCTION"
          test "$(aws lambda get-function-configuration --function-name "$API_FUNCTION" --query State --output text)" = "Active"
          test "$(aws lambda get-function-configuration --function-name "$API_FUNCTION" --query LastUpdateStatus --output text)" = "Successful"

      - name: Promote the worker images
        run: |
          REGISTRY="${ECR_REGISTRY_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          # Same tag-based discovery as dev. Redundant across accounts — nothing
          # but prod functions is reachable with these credentials — but kept so
          # the two paths fail the same way if the tag ever goes missing.
          WORKERS=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filters lambda:function \
            --tag-filters "Key=Environment,Values=${DEPLOY_ENVIRONMENT}" \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text \
            | tr '\t' '\n' \
            | awk -F: '$NF ~ /^media-summarizer-worker-/ { print $NF }')
          test -n "$WORKERS" || { echo "No media-summarizer-worker-* functions tagged Environment=${DEPLOY_ENVIRONMENT}"; exit 1; }
          for FUNCTION_NAME in $WORKERS; do
            case "$FUNCTION_NAME" in
              *-"${DEPLOY_ENVIRONMENT}") ;;
              *) echo "Refusing to deploy: $FUNCTION_NAME is not a ${DEPLOY_ENVIRONMENT} function"; exit 1 ;;
            esac
          done
          echo "Promoting: $(echo "$WORKERS" | tr '\n' ' ')"
          for FUNCTION_NAME in $WORKERS; do
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "${REGISTRY}/${ECR_REPOSITORY}@${{ steps.digests.outputs.worker }}" \
              --no-cli-pager
          done
          for FUNCTION_NAME in $WORKERS; do
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            test "$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query State --output text)" = "Active"
            test "$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query LastUpdateStatus --output text)" = "Successful"
          done

      - name: Validate the prod health endpoint
        run: |
          API_ARN=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filters apigateway \
            --tag-filters "Key=Environment,Values=${DEPLOY_ENVIRONMENT}" \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '/apis/[^/]+$' \
            | head -1)
          test -n "$API_ARN" || { echo "No API Gateway tagged Environment=${DEPLOY_ENVIRONMENT}"; exit 1; }
          API_ENDPOINT=$(aws apigatewayv2 get-api --api-id "${API_ARN##*/}" --query ApiEndpoint --output text)
          HEALTH_BODY=$(mktemp)
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output "$HEALTH_BODY" \
            "$API_ENDPOINT/api/health/"
          jq -e '.status == "healthy"' "$HEALTH_BODY"
