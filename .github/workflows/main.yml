name: Main Branch Checks

on:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install from uv.lock, not from the pyproject ranges. `pip install -e
      # ".[dev]"` re-resolved every run, so CI could lint with a different ruff
      # or mypy than the one pinned in the lock and the one the owner runs
      # locally. The same drift on `fastapi>=0.104.0` took dev down (see the
      # comment in infrastructure/docker/lambda-api.Dockerfile).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy media_summarizer

      # The same guards as pr.yml, duplicated on purpose: `main` is not a
      # protected branch, so a direct push never opens a PR and would otherwise
      # skip every one of them. Keep the two lists in sync — a guard that only
      # runs on PRs is a guard the shortest path around it disables.
      - name: Guard — no orphaned completion-event queue name (task-143)
        run: |
          if grep -rn --include="*.py" --include="*.tf" -e "episode-completion-events" -e "EPISODE_COMPLETION_EVENTS_QUEUE" media_summarizer infrastructure/terraform; then
            echo "::error::Dead queue name resurfaced. Producers and consumer must converge on 'episode-completed-events' / EPISODE_COMPLETED_EVENTS_QUEUE (see task-143)."
            exit 1
          fi

      - name: Guard — no resurrected per-kind artifact queues (task-195)
        run: |
          if grep -rn --include="*.py" --include="*.tf" \
            -e "flashcards-queue" -e "notes-queue" -e "quiz-queue" \
            -e "summarization-queue" -e "summary-short-queue" -e "summary-detailed-queue" \
            media_summarizer infrastructure/terraform; then
            echo "::error::Dead per-kind artifact queue name resurfaced. All artifact types route to artifact-generator-queue (see task-195)."
            exit 1
          fi

      - name: Guard — single writer of the user_media TTL (task-243)
        run: python scripts/check_purge_at_writers.py

      - name: Guard — every env var used by the app is in .env.example
        run: python scripts/check_env_example_complete.py

  # The same job as pr.yml, duplicated for the same reason as the guards above: `main`
  # is not protected and this project commits straight to it, so a PR-only Terraform
  # check is a check that almost never runs. terraform-dev.yml covers fmt and the dev
  # root on a push, but only when the push touched infrastructure/terraform/** — and it
  # deliberately names no other root, so prod, staging, the shared registry root and the
  # platform module get their syntax check here or nowhere (task-341).
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      # `-backend=false`: no credentials, no state, no lock — so prod and staging are
      # syntax-checked without any prod identity being involved.
      - name: Validate every root and the shared module
        run: |
          for ROOT in envs/dev envs/prod envs/staging shared modules/platform; do
            echo "::group::$ROOT"
            terraform -chdir="infrastructure/terraform/$ROOT" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/$ROOT" validate
            echo "::endgroup::"
          done

  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint
