name: Mobile E2E Tests (Maestro)

on:
  push:
    branches: [main, second-brain-project]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - "mobile/.maestro/**"
      - ".github/workflows/mobile-e2e-maestro.yml"
  pull_request:
    branches: [main, second-brain-project]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - "mobile/.maestro/**"
  workflow_dispatch:
    inputs:
      flow_filter:
        description: "Maestro flow file pattern to run (e.g., '02_share_intake')"
        required: false
        default: ""
        type: string
      platform:
        description: "Platform to test"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - both

env:
  MAESTRO_VERSION: "1.38.0"
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------------
  # Android E2E Tests
  # -------------------------------------------------------------------
  android-e2e:
    name: Android Maestro E2E
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api-level: [33]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro installation
        run: maestro --version

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-v2

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD created"

      - name: Build Android dev client
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleDebug

      - name: Run Maestro E2E tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Install the APK
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk

            # Wait for device to be ready
            adb wait-for-device
            sleep 10

            # Run Maestro flows
            FLOW_DIR="mobile/.maestro"
            FLOW_FILTER="${{ github.event.inputs.flow_filter || '' }}"

            if [ -n "$FLOW_FILTER" ]; then
              maestro test "$FLOW_DIR/${FLOW_FILTER}.yaml" \
                --env=TEST_USER_EMAIL="${{ secrets.E2E_TEST_USER_EMAIL || 'e2e-test@mediasummarizer.com' }}" \
                --env=TEST_USER_PASSWORD="${{ secrets.E2E_TEST_USER_PASSWORD || 'TestPass123!' }}" \
                --env=API_BASE_URL="${{ secrets.E2E_API_BASE_URL || 'https://api-staging.mediasummarizer.com' }}" \
                --env=SHARE_TEST_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
                --format=junit \
                --output=maestro-report.xml \
                || true
            else
              maestro test "$FLOW_DIR" \
                --env=TEST_USER_EMAIL="${{ secrets.E2E_TEST_USER_EMAIL || 'e2e-test@mediasummarizer.com' }}" \
                --env=TEST_USER_PASSWORD="${{ secrets.E2E_TEST_USER_PASSWORD || 'TestPass123!' }}" \
                --env=API_BASE_URL="${{ secrets.E2E_API_BASE_URL || 'https://api-staging.mediasummarizer.com' }}" \
                --env=SHARE_TEST_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
                --format=junit \
                --output=maestro-report.xml \
                || true
            fi

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android-results-api${{ matrix.api-level }}
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/*

      - name: Upload Maestro screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-android-screenshots-api${{ matrix.api-level }}
          path: |
            ~/.maestro/tests/**/screenshots/
            ~/.maestro/tests/**/video/

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: maestro-report.xml
          check_name: "Maestro Android E2E (API ${{ matrix.api-level }})"
          comment_mode: "off"

  # -------------------------------------------------------------------
  # iOS E2E Tests (macOS runner required for iOS Simulator)
  # -------------------------------------------------------------------
  ios-e2e:
    name: iOS Maestro E2E
    runs-on: macos-14
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro installation
        run: maestro --version

      - name: Build iOS dev client
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild \
            -workspace MediaSummarizer.xcworkspace \
            -scheme MediaSummarizer \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            build

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE_ID" || true
          # Wait for simulator to be ready
          sleep 15

      - name: Install app on simulator
        working-directory: mobile/ios
        run: |
          APP_PATH=$(find build -name "*.app" -path "*/Debug-iphonesimulator/*" | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro E2E tests on iOS
        run: |
          FLOW_DIR="mobile/.maestro"
          FLOW_FILTER="${{ github.event.inputs.flow_filter || '' }}"

          if [ -n "$FLOW_FILTER" ]; then
            maestro test "$FLOW_DIR/${FLOW_FILTER}.yaml" \
              --env=TEST_USER_EMAIL="${{ secrets.E2E_TEST_USER_EMAIL || 'e2e-test@mediasummarizer.com' }}" \
              --env=TEST_USER_PASSWORD="${{ secrets.E2E_TEST_USER_PASSWORD || 'TestPass123!' }}" \
              --env=API_BASE_URL="${{ secrets.E2E_API_BASE_URL || 'https://api-staging.mediasummarizer.com' }}" \
              --env=SHARE_TEST_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
              --format=junit \
              --output=maestro-report-ios.xml \
              || true
          else
            maestro test "$FLOW_DIR" \
              --env=TEST_USER_EMAIL="${{ secrets.E2E_TEST_USER_EMAIL || 'e2e-test@mediasummarizer.com' }}" \
              --env=TEST_USER_PASSWORD="${{ secrets.E2E_TEST_USER_PASSWORD || 'TestPass123!' }}" \
              --env=API_BASE_URL="${{ secrets.E2E_API_BASE_URL || 'https://api-staging.mediasummarizer.com' }}" \
              --env=SHARE_TEST_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ" \
              --format=junit \
              --output=maestro-report-ios.xml \
              || true
          fi

      - name: Upload Maestro iOS test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios-results
          path: |
            maestro-report-ios.xml
            ~/.maestro/tests/**/*

      - name: Upload Maestro iOS screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-ios-screenshots
          path: |
            ~/.maestro/tests/**/screenshots/
            ~/.maestro/tests/**/video/

      - name: Publish iOS test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: maestro-report-ios.xml
          check_name: "Maestro iOS E2E"
          comment_mode: "off"

  # -------------------------------------------------------------------
  # Summary
  # -------------------------------------------------------------------
  e2e-summary:
    name: Mobile E2E Summary
    runs-on: ubuntu-latest
    needs: [android-e2e, ios-e2e]
    if: always()

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate summary
        run: |
          echo "# Mobile E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Android E2E: ${{ needs.android-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS E2E: ${{ needs.ios-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.android-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-e2e.result }}" == "failure" ]]; then
            echo "**Status: FAILED** - Review test artifacts for failure details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See E2E_TESTING.md for failure triage guidance." >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [[ "${{ needs.android-e2e.result }}" == "success" ]] || \
               [[ "${{ needs.ios-e2e.result }}" == "success" ]]; then
            echo "**Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: SKIPPED** - No E2E jobs ran." >> $GITHUB_STEP_SUMMARY
          fi
