name: Mobile E2E Tests (Maestro)

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main, second-brain-project]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - "mobile/.maestro/**"
      - ".github/workflows/mobile-e2e-maestro.yml"
  pull_request:
    branches: [main, second-brain-project]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - "mobile/.maestro/**"
  workflow_dispatch:
    inputs:
      flow_filter:
        description: "Maestro flow file pattern to run (e.g., '02_share_intake')"
        required: false
        default: ""
        type: string
      platform:
        description: "Platform to test"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - both

env:
  MAESTRO_VERSION: "2.8.0"
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------------
  # Android E2E Tests
  # -------------------------------------------------------------------
  android-e2e:
    name: Android Maestro E2E
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api-level: [33]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Validate Android E2E configuration
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SEARCH_TEST_TERM: ${{ secrets.E2E_SEARCH_TEST_TERM }}
          E2E_REVENUECAT_TEST_KEY: ${{ secrets.E2E_REVENUECAT_TEST_KEY }}
        run: |
          missing=0
          for name in E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_SEARCH_TEST_TERM E2E_REVENUECAT_TEST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro installation
        run: maestro --version

      - name: Free disk space for Android native tooling
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build self-contained Android E2E APK
        working-directory: mobile
        env:
          E2E_EMBED_DEBUG_BUNDLE: "1"
          EXPO_PUBLIC_E2E_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'https://jji077bi8e.execute-api.eu-west-3.amazonaws.com' }}
          EXPO_PUBLIC_REVENUCAT_GOOGLE_KEY: ${{ secrets.E2E_REVENUECAT_TEST_KEY }}
        run: |
          npm uninstall expo-dev-client --no-save --ignore-scripts
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Free Android build space before starting emulator
        run: |
          rm -rf mobile/node_modules mobile/android/.gradle mobile/android/app/build/intermediates
          rm -rf "$HOME/.gradle/caches"
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          df -h /

      - name: Run Maestro E2E tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW_FILTER: ${{ github.event.inputs.flow_filter || '' }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          MAESTRO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-android
          SEARCH_TEST_TERM: ${{ secrets.E2E_SEARCH_TEST_TERM }}
          API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'https://jji077bi8e.execute-api.eu-west-3.amazonaws.com' }}
          SHARE_TEST_URL: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-android-maestro.sh

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android-results-api${{ matrix.api-level }}
          path: maestro-report.xml
          retention-days: 1

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: maestro-report.xml
          check_name: "Maestro Android E2E (API ${{ matrix.api-level }})"
          comment_mode: "off"

  # -------------------------------------------------------------------
  # iOS E2E Tests (macOS runner required for iOS Simulator)
  # -------------------------------------------------------------------
  ios-e2e:
    name: iOS Maestro E2E
    # Expo 55 uses Swift isolated conformances that require the Xcode 26 toolchain.
    runs-on: macos-15
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Validate iOS E2E configuration
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_SEARCH_TEST_TERM: ${{ secrets.E2E_SEARCH_TEST_TERM }}
          E2E_REVENUECAT_TEST_KEY: ${{ secrets.E2E_REVENUECAT_TEST_KEY }}
        run: |
          missing=0
          for name in E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_SEARCH_TEST_TERM E2E_REVENUECAT_TEST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro installation
        run: maestro --version

      # Covers everything baked into the simulator binary: sources, lockfile,
      # native config, the EXPO_PUBLIC_* values embedded in the JS bundle, and
      # the toolchain. The Maestro flows are excluded, so editing a flow reuses
      # the cached build instead of paying for a rebuild.
      - name: Compute iOS E2E fingerprints
        id: fingerprints
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'https://jji077bi8e.execute-api.eu-west-3.amazonaws.com' }}
          EXPO_PUBLIC_REVENUCAT_APPLE_KEY: ${{ secrets.E2E_REVENUECAT_TEST_KEY }}
        run: |
          app_fingerprint=$(
            {
              git ls-files -s -- mobile ':!mobile/.maestro'
              printf 'api=%s\n' "$EXPO_PUBLIC_API_BASE_URL"
              printf 'revenuecat=%s\n' "$EXPO_PUBLIC_REVENUCAT_APPLE_KEY"
              printf 'toolchain=%s\n' "$(xcodebuild -version | tr '\n' ' ')"
            } | shasum -a 256 | cut -c1-16
          )
          echo "app=$app_fingerprint" >> "$GITHUB_OUTPUT"

      # restore/save rather than actions/cache: the latter only saves in its post
      # step when the job succeeds, which would never cache the build on a red
      # run — precisely the run whose next attempt needs it.
      - name: Restore cached iOS E2E app
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/ios/build/Build/Products/Release-iphonesimulator
          key: ios-e2e-app-${{ steps.fingerprints.outputs.app }}

      - name: Build self-contained iOS E2E app
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          E2E_EMBED_DEBUG_BUNDLE: "1"
          EXPO_PUBLIC_E2E_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'https://jji077bi8e.execute-api.eu-west-3.amazonaws.com' }}
          EXPO_PUBLIC_REVENUCAT_APPLE_KEY: ${{ secrets.E2E_REVENUECAT_TEST_KEY }}
        run: |
          npm uninstall expo-dev-client --no-save --ignore-scripts
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild \
            -workspace MediaSummarizer.xcworkspace \
            -scheme MediaSummarizer \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            build

      - name: Save cached iOS E2E app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/ios/build/Build/Products/Release-iphonesimulator
          key: ios-e2e-app-${{ steps.fingerprints.outputs.app }}

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | grep -oE "[0-9A-F-]{36}")
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install app on simulator
        working-directory: mobile/ios
        run: |
          APP_PATH=$(find build -name "*.app" -path "*/Release-iphonesimulator/*" | head -1)
          test -n "$APP_PATH"
          xcrun simctl install booted "$APP_PATH"

      # Flows that already passed against this exact app + flow fingerprint are
      # skipped, so a re-run only replays what is still red. Any source or flow
      # edit changes a fingerprint and replays the whole suite.
      - name: Restore passed iOS flows
        uses: actions/cache/restore@v4
        with:
          path: .maestro-ios-passed
          # Keyed on the app build only: the marker file records a per-flow hash,
          # so editing one flow replays that flow and leaves the others skipped.
          # Each attempt saves under a unique suffix, so the newest entry for this
          # build is picked up by prefix.
          key: ios-e2e-passed-${{ steps.fingerprints.outputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-e2e-passed-${{ steps.fingerprints.outputs.app }}-

      - name: Run Maestro E2E tests on iOS
        env:
          FLOW_FILTER: ${{ github.event.inputs.flow_filter || '' }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          MAESTRO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-ios
          SEARCH_TEST_TERM: ${{ secrets.E2E_SEARCH_TEST_TERM }}
          API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'https://jji077bi8e.execute-api.eu-west-3.amazonaws.com' }}
          SHARE_TEST_URL: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        run: bash .github/scripts/run-ios-maestro.sh

      # Saved even when the run is red: the flows that did pass stay recorded so
      # the next attempt resumes after them.
      - name: Save passed iOS flows
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .maestro-ios-passed
          key: ios-e2e-passed-${{ steps.fingerprints.outputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Maestro iOS test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios-results
          path: maestro-ios-reports/
          retention-days: 1

  # -------------------------------------------------------------------
  # Summary
  # -------------------------------------------------------------------
  e2e-summary:
    name: Mobile E2E Summary
    runs-on: ubuntu-latest
    needs: [android-e2e, ios-e2e]
    if: always()

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate summary
        run: |
          echo "# Mobile E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Android E2E: ${{ needs.android-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS E2E: ${{ needs.ios-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.android-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-e2e.result }}" == "failure" ]]; then
            echo "**Status: FAILED** - Review test artifacts for failure details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See E2E_TESTING.md for failure triage guidance." >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [[ "${{ needs.android-e2e.result }}" == "success" ]] || \
               [[ "${{ needs.ios-e2e.result }}" == "success" ]]; then
            echo "**Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: SKIPPED** - No E2E jobs ran." >> $GITHUB_STEP_SUMMARY
          fi
