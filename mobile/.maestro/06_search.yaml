# Flow 06: Algolia lexical search
# Data contract: TEST_USER_EMAIL owns at least one indexed transcript matching
# SEARCH_TEST_TERM. CI injects the term; the flow never hardcodes test content.
appId: com.secondbrainlabs.core
tags:
  - critical
  - search

---

- launchApp:
    clearState: true

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

- tapOn:
    id: "search-tab-button"

- assertVisible:
    text: "Search your library..."

- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TEST_TERM}

- extendedWaitUntil:
    visible:
      id: "search-result-card"
    timeout: 15000

- tapOn:
    id: "search-result-card"
    index: 0

- extendedWaitUntil:
    visible:
      text: "AI Artifacts"
    timeout: 10000
