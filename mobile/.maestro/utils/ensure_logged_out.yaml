# Normalize authentication state between aggregate flows. On iOS, clearing the
# app container does not necessarily remove credentials persisted in Keychain.
appId: com.secondbrainlabs.core

---
- extendedWaitUntil:
    visible:
      id: "login-email-input|account-tab-button"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "account-tab-button"
    file: sign_out.yaml
