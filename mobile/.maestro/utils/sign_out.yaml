# Reusable sign-out sub-flow
# Assumes an authenticated session with the tab bar visible.
appId: com.secondbrainlabs.core

---

- tapOn:
    id: "account-tab-button"

- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 10000

# The menu no longer fits the fold on short screens now that the subscription
# entry point sits above it, and a tap on an off-screen row fails with nothing
# more than "element not found". Scroll it in first; the screen body is a
# ScrollView, and this is a no-op when the row is already on screen.
- scrollUntilVisible:
    element:
      id: "account-sign-out-button"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "account-sign-out-button"

# The confirmation button carries an app-unique label so the tap never resolves
# to the menu item or the alert title, which both read "Sign Out" on iOS.
- extendedWaitUntil:
    visible:
      text: "Yes, sign out"
    timeout: 10000

- tapOn:
    text: "Yes, sign out"

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
