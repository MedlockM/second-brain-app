# Flow 07: RevenueCat paywall smoke test
# Enters through the Account tab CTA, the same path a real user takes, so the
# flow breaks if the paywall ever becomes unreachable again. It verifies
# packages are loaded and that closing returns to the caller, never taps
# Subscribe. The media-summarizer://paywall deep link still works but is no
# longer the only way in, so the flow no longer depends on it.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

- tapOn:
    id: "account-tab-button"

- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 15000

# The CTA reads "Upgrade" or "Manage subscription" depending on whether the test
# account holds an entitlement, so it is only ever addressed by test id. The
# scroll is a no-op while the card stays above the fold.
- scrollUntilVisible:
    element:
      id: "account-upgrade-button"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "account-upgrade-button"

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 45000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"
- assertNotVisible:
    text: "Unavailable"

# The Close button lives in the fixed header, outside the tier ScrollView, so it
# stays on screen however far the list is scrolled. Asserting it instead of
# scrolling to it also avoids a swipe-down on an iOS sheet, which the system
# reads as a dismissal.
- assertVisible:
    id: "paywall-close-button"
- tapOn:
    id: "paywall-close-button"

# Closing returns to the screen that opened the paywall — the Account tab, not
# the inbox. The Account screen sits behind the sheet on iOS, so the dismissal
# itself is what has to be asserted.
- extendedWaitUntil:
    notVisible:
      id: "paywall-screen"
    timeout: 10000
- assertVisible:
    id: "account-screen"
