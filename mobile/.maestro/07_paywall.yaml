# Flow 07: RevenueCat paywall smoke test
# Enters through the Account tab CTA, the same path a real user takes, so the
# flow breaks if the paywall ever becomes unreachable again. It verifies
# packages are loaded and that closing returns to the caller, never taps
# Subscribe. The media-summarizer://paywall deep link still works but is no
# longer the only way in, so the flow no longer depends on it.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

- tapOn:
    id: "account-tab-button"

- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 15000

# The CTA reads "Upgrade" or "Manage subscription" depending on whether the test
# account holds an entitlement, so it is only ever addressed by test id. The
# scroll is a no-op while the card stays above the fold.
- scrollUntilVisible:
    element:
      id: "account-upgrade-button"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "account-upgrade-button"

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 45000
- assertVisible:
    text: "Choose Your Plan"

# A tier is only rendered when the store has a package to sell for it, so the
# three names being on screen *is* the check that the three Test Store products
# are still wired to the three config tiers. There is no longer an "Unavailable"
# row to assert the absence of: a tier the store cannot sell is not drawn at all.
- assertVisible:
    text: "Reader"
- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"

# One CTA in a sticky footer buys the selected plan, so it is on screen whatever
# the scroll position.
- assertVisible:
    id: "paywall-subscribe-button"

# App Store guideline 3.1.2 and Play's subscription policy both require these two
# links on the purchase screen itself, in the binary. They were missing entirely
# until the paywall rework, so the flow guards them: losing them again is a store
# rejection, not a cosmetic regression.
- scrollUntilVisible:
    element:
      id: "paywall-terms-link"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "paywall-terms-link"
- assertVisible:
    id: "paywall-privacy-link"

# The Close button lives in the fixed header, outside the tier ScrollView, so it
# stays on screen however far the list is scrolled. Asserting it instead of
# scrolling to it also avoids a swipe-down on an iOS sheet, which the system
# reads as a dismissal.
- assertVisible:
    id: "paywall-close-button"
- tapOn:
    id: "paywall-close-button"

# Closing returns to the screen that opened the paywall — the Account tab, not
# the inbox. The Account screen sits behind the sheet on iOS, so the dismissal
# itself is what has to be asserted.
- extendedWaitUntil:
    notVisible:
      id: "paywall-screen"
    timeout: 10000
- assertVisible:
    id: "account-screen"
