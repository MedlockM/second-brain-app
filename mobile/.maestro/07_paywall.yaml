# Flow 07: RevenueCat paywall smoke test
# Opens the route directly so the test does not depend on a temporary product
# entry point. It verifies packages are loaded but never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

- openLink: "media-summarizer://paywall"

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 10000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertVisible:
    text: "Mix"
- assertVisible:
    text: "Audio-Heavy"

# The cards fall back to "Unavailable" when RevenueCat returns no products.
- assertNotVisible:
    text: "Unavailable"

- tapOn:
    id: "paywall-close-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 5000
