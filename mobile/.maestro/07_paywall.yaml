# Flow 07: RevenueCat paywall smoke test
# Opens the route directly so the test does not depend on a temporary product
# entry point. It verifies packages are loaded but never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

# iOS asks for confirmation before handing a scheme URL to the app
# ('Open in "Media Summarizer"?'), and without that confirmation the paywall
# never mounts. autoVerify dismisses the dialog; Android opens the scheme
# directly and ignores the flag.
- openLink:
    link: "media-summarizer://paywall"
    autoVerify: true

# autoVerify alone leaves the dialog up on this runner, so the confirm button
# still has to be tapped. It carries its label in accessibilityText only, which
# no text selector reaches, hence the position: the alert is a fixed two-button
# row and this point is the centre of its right-hand Open button, measured off a
# captured hierarchy.
#
# The pre-wait is long on purpose. Tapping this point once the paywall is up hits
# a tier's Subscribe button and pushes a StoreKit sheet over the screen, so the
# tap must only fire when the paywall is genuinely absent rather than slow.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "paywall-screen"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "paywall-screen"
          commands:
            - tapOn:
                point: "67%,56%"
            # The dialog belongs to the app that opened the link, and the session
            # keeps querying that app after the tap: two runs timed out here
            # while a separate `maestro hierarchy` process saw the paywall
            # mounted with valid bounds. Re-target the driver at our app.
            # `stopApp: false` brings it to the front without a cold launch,
            # which would discard the route the link just opened.
            - launchApp:
                appId: com.secondbrainlabs.core
                stopApp: false

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 45000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      id: "paywall-close-button"
    direction: UP
    timeout: 10000
- tapOn:
    id: "paywall-close-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 5000
