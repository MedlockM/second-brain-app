# Flow 07: RevenueCat paywall smoke test
# Opens the route directly so the test does not depend on a temporary product
# entry point. It verifies packages are loaded but never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

- openLink: "media-summarizer://paywall"

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 10000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      id: "paywall-close-button"
    direction: UP
    timeout: 10000
- tapOn:
    id: "paywall-close-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 5000
