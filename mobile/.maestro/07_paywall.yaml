# Flow 07: RevenueCat paywall smoke test
# Opens the route directly so the test does not depend on a temporary product
# entry point. It verifies packages are loaded but never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

# iOS asks for confirmation before handing a scheme URL to the app
# ('Open in "Media Summarizer"?'), and without that confirmation the paywall
# never mounts. autoVerify dismisses the dialog; Android opens the scheme
# directly and ignores the flag.
- openLink:
    link: "media-summarizer://paywall"
    autoVerify: true

# A blind positional fallback was tried here and made things worse: the dialog
# buttons are only addressable by accessibilityText, and when the paywall was
# merely slow to mount the tap landed on a tier's Subscribe button instead.
# autoVerify is the only safe way to clear the dialog, so give the route the room
# it needs rather than second-guessing it.
- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 60000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      id: "paywall-close-button"
    direction: UP
    timeout: 10000
- tapOn:
    id: "paywall-close-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 5000
