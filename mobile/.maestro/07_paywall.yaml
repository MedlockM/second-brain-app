# Flow 07: RevenueCat paywall smoke test
# Opens the route directly so the test does not depend on a temporary product
# entry point. It verifies packages are loaded but never taps Subscribe.
appId: com.secondbrainlabs.core
tags:
  - critical
  - paywall

---

- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- runFlow: utils/login.yaml

# iOS asks for confirmation before handing a scheme URL to the app
# ('Open in "Media Summarizer"?'), and without that confirmation the paywall
# never mounts. autoVerify dismisses the dialog; Android opens the scheme
# directly and ignores the flag.
- openLink:
    link: "media-summarizer://paywall"
    autoVerify: true

# Fallback for when autoVerify misses the dialog. The confirm button carries its
# label in accessibilityText only, so no text selector can reach it — hence the
# position: the alert is a fixed two-button row with Open on the right. The
# optional wait first rules out a paywall that simply mounted slowly, so the tap
# only ever fires while the dialog is genuinely still up.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "paywall-screen"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "paywall-screen"
          commands:
            - tapOn:
                point: "67%,56%"

- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 45000
- assertVisible:
    text: "Choose Your Plan"
- assertVisible:
    text: "Reader"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Mix"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Mix"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      text: "Audio-Heavy"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Audio-Heavy"
- assertNotVisible:
    text: "Unavailable"

- scrollUntilVisible:
    element:
      id: "paywall-close-button"
    direction: UP
    timeout: 10000
- tapOn:
    id: "paywall-close-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 5000
