# Flow 05: Artifact Trigger Action
# Tests the critical path of generating an AI artifact (summary) from the
# media detail screen:
# - Navigate to a media item that is ready for artifacts
# - Expand the AI Artifacts section
# - Tap "Generate" on a summary artifact
# - Verify the artifact enters "Queued" then "Generating" state
# - Verify completion or progress indication
appId: com.secondbrainlabs.core
tags:
  - critical
  - share-first
  - artifact-generation

---

# Launch and authenticate
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

# Wait for inbox to load
- assertVisible:
    text: "Good .*"
    regex: true
    timeout: 5000

# Share a URL and wait for it to be ready for artifacts
# (In CI with a staging backend, this may take time)
- openLink: "media-summarizer://share?url=${SHARE_TEST_URL}&sourceApp=android-share-intent"

- assertVisible:
    text: "Collection"
    timeout: 5000

- tapOn:
    text: "Save"

- assertVisible:
    text: "Saved"
    timeout: 8000

# Return to inbox
- assertVisible:
    text: "Inbox"
    timeout: 5000

# Wait for the item to appear in the inbox
- extendedWaitUntil:
    visible:
      text: "youtube.com"
    timeout: 20000

# Tap the media item to go to detail
- tapOn:
    text: "youtube.com"
    index: 0

# Wait for detail screen to load
- assertVisible:
    text: "AI Artifacts"
    timeout: 10000

# Expand the AI Artifacts section
- tapOn:
    text: "AI Artifacts"

# Wait for artifacts list to appear
- assertVisible:
    text: "Summary"
    timeout: 3000

# Check if the Generate button is available (media must be ready_for_artifacts)
# If "Generate" is visible, tap it; otherwise the media is still processing
- tapOn:
    text: "Generate"
    index: 0
    optional: true

# If Generate was tapped, verify the artifact enters a progress state
- assertVisible:
    text: "Queued|Generating"
    regex: true
    optional: true
    timeout: 5000

# Wait for potential completion (with generous timeout for CI)
# The artifact may show "Ready" if processing completes quickly
- assertVisible:
    text: "Ready|Queued|Generating|Processing"
    regex: true
    optional: true
    timeout: 30000

# If media is still processing, verify the "Processing..." waiting text
- assertVisible:
    text: "Processing..."
    optional: true

# Navigate back to inbox to confirm no crashes
- pressKey: back

- assertVisible:
    text: "Inbox"
    timeout: 5000
