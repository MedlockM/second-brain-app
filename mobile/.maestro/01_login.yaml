# Flow 01: Email registration and login
# MAESTRO_RUN_ID is supplied by CI and keeps registration idempotent.
# Native Apple/Google sheets stay in the manual validation tasks.
appId: com.secondbrainlabs.core
tags:
  - critical
  - auth

---

# Launch the app fresh
- runFlow: utils/reset_app.yaml

- runFlow: utils/ensure_logged_out.yaml

# Wait for the app to initialize (splash screen dismiss)
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

# Register a fresh user and verify the development bypass lands on Inbox.
- tapOn:
    id: "login-sign-up-button"

- assertVisible:
    id: "register-email-input"

- tapOn:
    id: "register-email-input"
- inputText: "e2e-register-${MAESTRO_RUN_ID}@test.local"

- tapOn:
    id: "register-password-input"
- inputText: ${TEST_USER_PASSWORD}

- tapOn:
    id: "register-submit-button"

- extendedWaitUntil:
    visible:
      id: "language-onboarding-screen"
    timeout: 15000

- tapOn:
    id: "language-onboarding-continue-button"

- extendedWaitUntil:
    visible:
      id: "inbox-screen"
    timeout: 15000

# End the fresh session, then exercise explicit email/password login.
- runFlow: utils/sign_out.yaml

- runFlow: utils/login.yaml

# Verify we landed on the inbox tab
- assertVisible:
    id: "inbox-screen"
- assertVisible:
    id: "file-tray-outline"
    optional: true

# Verify the greeting is shown (dynamic based on time of day)
- assertVisible:
    text: "Good .*"
    optional: true
