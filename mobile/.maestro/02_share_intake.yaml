# Flow 02: Share Intake
# Simulates receiving a shared URL from an external app and confirms
# the share confirmation screen displays correctly with save capability.
#
# Covers:
# - Android: deep link via custom scheme (media-summarizer://share?url=...)
# - iOS: note that native share extension automation is limited in Maestro;
#   see E2E_TESTING.md for the fallback Appium strategy.
appId: com.mediasummarizer.app
tags:
  - critical
  - share-first
  - share-intake

---

# Launch the app and authenticate
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

# Simulate a share intent via deep link
# This triggers the useShareIntent hook which navigates to /share-confirm
- openLink: "media-summarizer://share?url=${SHARE_TEST_URL}&sourceApp=android-share-intent"

# Verify the share confirmation screen is shown
- assertVisible:
    text: "Collection"
    timeout: 5000

# Verify the URL preview displays the shared URL
- assertVisible:
    text: "youtube.com"
    timeout: 3000

# Verify Save button is present and enabled
- assertVisible:
    text: "Save"

# Verify organization options are shown
- assertVisible:
    text: "Unsorted"
- assertVisible:
    text: "Tags"

# Test the note input field
- tapOn:
    text: "Note"
    optional: true
- inputText: "Test E2E share note"

# Tap Save to submit the URL
- tapOn:
    text: "Save"

# Verify success animation/feedback
- assertVisible:
    text: "Saved"
    timeout: 8000

# After auto-dismiss, verify we return to the inbox
- assertVisible:
    text: "Inbox"
    timeout: 5000
