# Flow 02: Share Intake — currently SKIPPED.
#
# As of 2026-06-11 the share-confirmation screen is only opened when the
# expo-share-intent native module resolves a valid intent (App Group payload
# on iOS, native intent on Android). A pure deep link via `openLink` no
# longer surfaces the screen — the path is intentionally redirected to the
# inbox by app/+native-intent.tsx. Re-enable this flow once an automation
# path that exercises the real native share is in place (see E2E_TESTING.md
# for the planned Appium fallback).
appId: com.secondbrainlabs.core
tags:
  - skipped
  - share-intake

---

# Auth-only smoke test so this file still runs cleanly in `maestro test .maestro/`.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

- assertVisible:
    text: "Inbox"
    timeout: 10000
