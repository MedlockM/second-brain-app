# Flow 03: Inbox Visibility
# Verifies that shared items appear in the inbox after a share submission.
#
# The current inbox UI deliberately omits per-item processing badges/spinners
# (see app/(tabs)/inbox.tsx header comment) — items either appear as optimistic
# pending placeholders or as plain backend cards with a media-type badge.
#
# Last reviewed against the codebase on 2026-06-11.
appId: com.secondbrainlabs.core
tags:
  - critical
  - share-first
  - inbox

---

# Launch and authenticate
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

# Inbox: greeting + Daily Digest entry point
- assertVisible:
    text: "Good .*"
    regex: true
    timeout: 5000

- assertVisible:
    text: "Daily Digest"

# When the inbox already has items, the YOUR MEDIA section header is shown.
- assertVisible:
    text: "YOUR MEDIA"
    optional: true

# Simulate a share to populate the inbox
- openLink: "media-summarizer://share?url=${SHARE_TEST_URL}&sourceApp=android-share-intent"

- assertVisible:
    text: "Save Link"
    timeout: 5000

- tapOn:
    text: "Save"

- assertVisible:
    text: "Saved!"
    timeout: 8000

# Wait for auto-dismiss back to inbox
- assertVisible:
    text: "Inbox"
    timeout: 8000

# Verify the shared URL host appears in a card. Cards may be either:
# - the optimistic "local" placeholder (pre-confirmation),
# - or the backend card once useMediaPolling has refetched on focus.
- extendedWaitUntil:
    visible:
      text: "youtube.com"
    timeout: 15000

# Once the backend card lands, a media-type badge becomes visible.
# YouTube URLs surface as "VIDEO" via getMediaTypeLabel("youtube_video").
- assertVisible:
    text: "VIDEO"
    optional: true
    timeout: 15000

# Pull-to-refresh sanity check (does not assert anything specific — we mostly
# want to confirm no crash and that the screen still renders the greeting).
- scroll:
    direction: DOWN
    duration: 500
- scroll:
    direction: UP
    duration: 500

- assertVisible:
    text: "Good .*"
    regex: true
