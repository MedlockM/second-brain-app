# Flow 03: Home Visibility
# Verifies that shared items appear on the Home screen after a share submission.
#
# Since task-307 this screen is no longer a vertical list of every item: it is a
# greeting, the Daily Digest card, and two horizontally scrollable rows of tiles
# — "Continue learning" and "Recently added". The full library moved to the
# Search tab (task-306), so nothing asserted here looks for it.
#
# A pending share renders as a tile at the head of "Recently added" showing the
# shared URL, which is what makes the post-share assertion below resolvable
# before the backend has confirmed anything.
#
# Last reviewed against the codebase on 2026-08-21.
appId: com.secondbrainlabs.core
tags:
  - critical
  - share-first
  - inbox

---

# Launch and authenticate
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

# Home: greeting + Daily Digest entry point
- assertVisible:
    text: "Good .*"
    regex: true
    timeout: 5000

- assertVisible:
    text: "Daily Digest"

# "Continue learning" is absent entirely until the account has engaged with
# something — a generation launched, or an artifact opened and read. A freshly
# seeded test account has done neither, so this is optional by design.
- assertVisible:
    text: "Continue learning"
    optional: true

# "Recently added" holds whatever the account already has; it becomes
# non-optional after the share below.
- assertVisible:
    text: "Recently added"
    optional: true

# Simulate a share to populate the row
- openLink: "media-summarizer://share?url=${SHARE_TEST_URL}&sourceApp=android-share-intent"

- assertVisible:
    text: "Save Link"
    timeout: 5000

- tapOn:
    text: "Save"

- assertVisible:
    text: "Saved!"
    timeout: 8000

# Wait for auto-dismiss back to Home
- assertVisible:
    text: "Inbox"
    timeout: 8000

# The share is now in the row, either as the optimistic pending tile (which
# shows the shared URL while the backend catches up) or as the confirmed media
# tile once useMediaPolling has refetched on focus. Either way the row exists.
- assertVisible:
    text: "Recently added"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: "youtube.com"
    timeout: 15000

# The row scrolls horizontally; the page scrolls vertically. Both are exercised
# here as a sanity check — we mostly want to confirm no crash and that the
# screen still renders the greeting afterwards.
- scroll:
    direction: DOWN
    duration: 500
- scroll:
    direction: UP
    duration: 500

- assertVisible:
    text: "Good .*"
    regex: true
