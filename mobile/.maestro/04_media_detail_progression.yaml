# Flow 04: Media Detail Progression
# Navigates from the inbox to a media detail screen and verifies:
# - Header with back button is present
# - AI Artifacts section is present, expandable, and lists every tile
# - Transcript section is present (status row OR rendered transcript)
# - Back navigation returns to the inbox
#
# Last reviewed against the codebase on 2026-06-11.
# The "AI Artifacts" tiles are: Summary, Detailed summary, Learning notes,
# Flashcards, Quiz (each backed by a distinct backend artifact_type).
appId: com.secondbrainlabs.core
tags:
  - critical
  - share-first
  - media-detail

---

# Launch and authenticate
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome back"
    timeout: 15000

- runFlow: utils/login.yaml

# Wait for inbox to render
- assertVisible:
    text: "Good .*"
    regex: true
    timeout: 5000

# Ensure the inbox has at least one card to tap. We share a fresh item and
# wait for it to land — this avoids depending on pre-existing state.
- openLink: "media-summarizer://share?url=${SHARE_TEST_URL}&sourceApp=android-share-intent"

- assertVisible:
    text: "Save Link"
    timeout: 5000

- tapOn:
    text: "Save"

- assertVisible:
    text: "Saved!"
    timeout: 8000

- assertVisible:
    text: "Inbox"
    timeout: 8000

- extendedWaitUntil:
    visible:
      text: "youtube.com"
    timeout: 15000

# Tap the freshly-shared item card to open the detail screen
- tapOn:
    text: "youtube.com"
    index: 0

# Detail screen: AI Artifacts section is present
- assertVisible:
    text: "AI Artifacts"
    timeout: 10000

# Expand the AI Artifacts dropdown
- tapOn:
    text: "AI Artifacts"

# All five artifact tiles must be listed
- assertVisible:
    text: "Summary"
    timeout: 3000
- assertVisible:
    text: "Detailed summary"
- assertVisible:
    text: "Learning notes"
- assertVisible:
    text: "Flashcards"
- assertVisible:
    text: "Quiz"

# Transcript section: when ready, the actual transcript text is rendered
# inline; before that, a status label is shown. Either is acceptable here.
- scroll:
    direction: DOWN
    duration: 300

- assertVisible:
    text: "Transcript"
    optional: true

- assertVisible:
    text: "Loading transcript|Transcript processing will start soon|Extracting audio|Transcribing audio|.+"
    regex: true
    optional: true

# Back navigation: tap the back arrow (accessibility label "Go back")
- tapOn:
    id: "Go back"
    optional: true

- pressKey:
    key: back
    optional: true

# Verify we are back on the inbox
- assertVisible:
    text: "Inbox"
    timeout: 5000
