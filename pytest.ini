[pytest]
testpaths = media_summarizer/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --cov=media_summarizer
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --strict-markers
    -v
    -m "not forecast"

# Test markers for CI/CD environment management
markers =
    # Test environment categories
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (slower, uses real services)
    component: Component integration tests (no workers needed)
    workflow: Workflow integration tests (requires workers)
    e2e: End-to-end tests (full system)

    # Infrastructure requirements
    requires_workers: Test needs background workers running
    requires_localstack: Test needs LocalStack services
    requires_database: Test needs database connection
    requires_stripe: Test needs Stripe API access
    requires_whisper: Test needs Whisper service
    requires_all_services: Test needs all external services running

    # Test characteristics
    slow: Slow running tests (>30 seconds)
    fast: Fast tests (<5 seconds)
    api: API endpoint tests
    worker: Worker component tests
    adapter: Adapter layer tests
    core: Core business logic tests
    database: Database integration tests

    # CI/CD specific
    ci_only: Tests that should only run in CI environment
    local_only: Tests that should only run in local development
    nightly: Tests for nightly builds (long running)
    smoke: Smoke tests for quick validation
    forecast: Tests for the minutes forecast feature (disabled in V1; run with -m forecast)

# Coverage configuration
[coverage:run]
source = media_summarizer
omit =
    media_summarizer/tests/*
    media_summarizer/scripts/*
    media_summarizer/infrastructure/*
    */__init__.py
    media_summarizer/api/main.py
    media_summarizer/tests/end_to_end/*
parallel = true
concurrency = multiprocessing, thread

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError
    @abstractmethod
    @abc.abstractmethod
show_missing = True
fail_under = 80
precision = 2

[coverage:html]
directory = htmlcov
title = Media Summarizer Coverage Report

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = true
