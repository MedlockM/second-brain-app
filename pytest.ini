[pytest]
testpaths = media_summarizer/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --cov=media_summarizer
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=80

# Coverage configuration
[coverage:run]
source = media_summarizer
omit = 
    media_summarizer/tests/*
    media_summarizer/scripts/*
    media_summarizer/infrastructure/*
    */__init__.py
    media_summarizer/api/main.py
parallel = true
concurrency = multiprocessing, thread

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError
    @abstractmethod
    @abc.abstractmethod
show_missing = True
fail_under = 80
precision = 2

[coverage:html]
directory = htmlcov
title = Media Summarizer Coverage Report

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = true