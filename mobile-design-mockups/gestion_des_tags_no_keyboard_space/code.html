<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-surface text-on-surface h-[100dvh] w-screen overflow-hidden flex flex-col antialiased selection:bg-secondary-container/50">
<!-- Conceptual Background (Visible above the modal in the original image, kept minimal here for focus) -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-low to-surface-container-high -z-10 pointer-events-none"></div>
<!-- Main App Container (Simulating the 'modal' look from the screenshot) -->
<main class="flex-1 flex flex-col bg-surface shadow-[0_-8px_32px_rgba(43,45,66,0.08)] rounded-t-[32px] mt-12 overflow-hidden relative">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 rounded-full bg-outline-variant/50"></div>
</div>
<!-- TopAppBar Contextual -->
<header class="flex justify-between items-center px-6 py-4 w-full bg-surface/90 backdrop-blur-md sticky top-0 z-10">
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-dim transition-colors scale-95 active:opacity-80 transition-all focus:outline-none focus:ring-2 focus:ring-secondary-container">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-headline-sm font-bold tracking-tight text-on-surface">0 tag</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-6">
<!-- Search / Add Input -->
<div class="mt-4 mb-8">
<div class="relative flex items-center group">
<div class="absolute left-4 w-0.5 h-5 bg-secondary-container rounded-full group-focus-within:bg-primary transition-colors"></div>
<input autofocus="" class="w-full bg-surface-container-low border-0 rounded-2xl py-4 pl-8 pr-4 text-body font-body text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-secondary-container focus:bg-surface transition-all shadow-[0_4px_12px_rgba(43,45,66,0.02)]" placeholder="Ajouter un tag" type="text"/>
</div>
</div>
<!-- List Section -->
<section>
<h2 class="font-headline text-sm font-bold text-on-surface-variant mb-4 uppercase tracking-wider pl-2">Autres</h2>
<div class="bg-surface-container-low rounded-[24px] overflow-hidden shadow-[0_8px_24px_rgba(43,45,66,0.03)] border border-outline-variant/10">
<!-- List Item 1 -->
<button class="w-full flex items-center justify-between px-6 py-4 bg-transparent hover:bg-surface-container-high focus:bg-surface-container-high transition-colors active:bg-surface-dim group text-left border-b border-outline-variant/20 last:border-b-0">
<span class="font-body text-base text-on-surface font-medium">Tag1</span>
<span class="font-label text-sm text-outline group-hover:text-on-surface-variant transition-colors">1</span>
</button>
<!-- List Item 2 -->
<button class="w-full flex items-center justify-between px-6 py-4 bg-transparent hover:bg-surface-container-high focus:bg-surface-container-high transition-colors active:bg-surface-dim group text-left border-b border-outline-variant/20 last:border-b-0">
<span class="font-body text-base text-on-surface font-medium">Tag2</span>
<span class="font-label text-sm text-outline group-hover:text-on-surface-variant transition-colors">1</span>
</button>
<!-- List Item 3 -->
<button class="w-full flex items-center justify-between px-6 py-4 bg-transparent hover:bg-surface-container-high focus:bg-surface-container-high transition-colors active:bg-surface-dim group text-left border-b border-outline-variant/20 last:border-b-0">
<span class="font-body text-base text-on-surface font-medium">Tag3</span>
<span class="font-label text-sm text-outline group-hover:text-on-surface-variant transition-colors">1</span>

<span class="font-body text-base text-on-surface font-medium">Tag4</span>

</button>
