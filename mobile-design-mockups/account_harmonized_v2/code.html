<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account - Media Summarizer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                extend: {

                        primary: "#ffcb05",
                        "background-light": "#fcf9f6",
                        "background-dark": "#211511",
                        "surface-tint": "#5e5f51",
                        "secondary-fixed": "#ffe08d",
                        "inverse-surface": "#31302f",
                        "on-primary-container": "#646657",
                        tertiary: "#56615a",
                        error: "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#ebe7e5",
                        surface: "#fcf9f6",
                        "inverse-on-surface": "#f4f0ed",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container": "#f1edea",
                        "on-surface": "#1c1b1a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#6f5700",
                        "surface-dim": "#ddd9d7",
                        background: "#fcf9f6",
                        "primary-fixed": "#e4e4d1",
                        "surface-container-low": "#f7f3f0",
                        "secondary-container": "#ffcb09",
                        "surface-bright": "#fcf9f6",
                        "on-primary": "#1c1b1a",
                        "surface-container-highest": "#e5e2df",
                        "on-background": "#2b2d42",
                        "surface-variant": "#e5e2df",
                        "tertiary-fixed": "#d9e5dc",
                        "on-primary-fixed": "#1b1d11",
                        "on-tertiary-container": "#5c6760",
                        "on-surface-variant": "#474740",
                        outline: "#78776f",
                        "on-secondary-fixed-variant": "#584400",
                        "inverse-primary": "#c7c8b5",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "primary-fixed-dim": "#c7c8b5",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#f2c000",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#241a00",
                        "outline-variant": "#c8c7bd",
                        secondary: "#745b00",
                        "primary-container": "#e4e4d1",
                        "on-tertiary-fixed": "#131e18",
                        "tertiary-fixed-dim": "#bdc9c1",
                        "on-primary-fixed-variant": "#46483a",
                        "tertiary-container": "#dae6dd",
                        "text-main": "#2b2d42",
                        "text-muted": "#8d99ae"
                    },
                    fontFamily: {
                        display: "Inter",
                        headline: ["Inter"],
                        body: ["Inter"],
                        label: ["Inter"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    boxShadow: {
                        soft: "0 4px 20px rgba(43, 45, 66, 0.04)"
                    }
                }
            }
        };
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-slate-100 font-display min-h-screen flex flex-col antialiased">
<!-- Header -->
<header class="flex items-center justify-center p-4 pt-8 sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10">
<h1 class="text-2xl font-bold tracking-tight text-text-main dark:text-slate-100">Account</h1>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24 px-4 max-w-md mx-auto w-full space-y-8">
<!-- Profile Section -->
<section class="flex flex-col items-center gap-4 mt-4">
<div class="relative">
<div class="h-24 w-24 rounded-full bg-cover bg-center shadow-soft border-4 border-white dark:border-slate-800" data-alt="Profile picture of Jane Doe" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD-rQJEcBhJVo_FFQ_xNMSywUdA8XqAX3Jd1hrn0y81FKcTZAh3jHdP81-CzOGS8n15CdoanasUVCgmLk7-gA3yR9IOD9X1G6gEpnVlR8NeOwXT8enOmNltTRESq649tSNNMS43Hs0S8hrQjSFGhWZNtAt8Qar28OxFz1fiBeZbf-s3Q3zokvWMw6JYTum3OB7s7pSiTOrhmCdtE21MbCrVyuO4Q-utvRFt8GK4eBTR78qW3QNL0Hxn95NhkP7GvwwY83yMF-Rnuw");'></div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-1.5 shadow-md flex items-center justify-center hover:bg-primary/90 transition-colors" style="background-color: #ffcb05; color: #1c1b1a;">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">edit</span>
</button>
</div>
<div class="text-center">
<h2 class="text-xl font-bold text-text-main dark:text-slate-100">Jane Doe</h2>
<p class="text-text-muted dark:text-slate-400 text-sm mt-1">jane@example.com</p>
</div>
</section>
<!-- Stat Grid (2x2) -->
<section class="grid grid-cols-2 gap-4">
<!-- Stat Box: Hours Saved -->
<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-soft flex flex-col items-center justify-center text-center">
<span class="text-3xl font-bold mb-1" style="color: #ffcb05;">42</span>
<span class="text-xs font-medium text-text-muted dark:text-slate-400 uppercase tracking-wider">Hours Saved</span>
</div>
<!-- Stat Box: Media Ingested -->
<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-soft flex flex-col items-center justify-center text-center">
<span class="text-3xl font-bold mb-1" style="color: #ffcb05;">128</span>
<span class="text-xs font-medium text-text-muted dark:text-slate-400 uppercase tracking-wider">Media Ingested</span>
</div>
<!-- Stat Box: Quizzes Taken -->
<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-soft flex flex-col items-center justify-center text-center">
<span class="text-3xl font-bold mb-1" style="color: #ffcb05;">15</span>
<span class="text-xs font-medium text-text-muted dark:text-slate-400 uppercase tracking-wider">Quizzes Taken</span>
</div>
<!-- Stat Box: Streak -->
<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-soft flex flex-col items-center justify-center text-center relative overflow-hidden">
<div class="absolute top-2 right-2" style="color: #ffcb05;">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<span class="text-3xl font-bold mb-1" style="color: #ffcb05;">7</span>
<span class="text-xs font-medium text-text-muted dark:text-slate-400 uppercase tracking-wider">Day Streak</span>
</div>
</section>
<!-- List Menu -->
<section class="bg-white dark:bg-slate-800 rounded-2xl shadow-soft overflow-hidden">
<div class="flex flex-col">
<!-- Menu Item: Integrations -->
<button class="flex items-center justify-between p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-b border-slate-100 dark:border-slate-700 w-full text-left active:bg-slate-100 dark:active:bg-slate-700">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(255, 203, 5, 0.1); color: #ffcb05;">
<span class="material-symbols-outlined text-sm">extension</span>
</div>
<span class="font-medium text-text-main dark:text-slate-100">Integrations</span>
</div>
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</button>
<!-- Menu Item: Appearance -->
<button class="flex items-center justify-between p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-b border-slate-100 dark:border-slate-700 w-full text-left active:bg-slate-100 dark:active:bg-slate-700">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(255, 203, 5, 0.1); color: #ffcb05;">
<span class="material-symbols-outlined text-sm">palette</span>
</div>
<span class="font-medium text-text-main dark:text-slate-100">Appearance</span>
</div>
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</button>
<!-- Menu Item: Export Data -->
<button class="flex items-center justify-between p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-b border-slate-100 dark:border-slate-700 w-full text-left active:bg-slate-100 dark:active:bg-slate-700">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(255, 203, 5, 0.1); color: #ffcb05;">
<span class="material-symbols-outlined text-sm">download</span>
</div>
<span class="font-medium text-text-main dark:text-slate-100">Export Data</span>
</div>
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</button>
<!-- Menu Item: Log Out -->
<button class="flex items-center justify-between p-4 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors w-full text-left active:bg-red-100 dark:active:bg-red-900/40 group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-500 group-hover:bg-red-200 dark:group-hover:bg-red-900/50 transition-colors">
<span class="material-symbols-outlined text-sm">logout</span>
</div>
<span class="font-medium text-red-500">Log Out</span>
</div>
</button>
</div>
</section>
<div class="h-8"></div> <!-- Bottom padding for nav bar -->
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full max-w-md mx-auto left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
<div class="flex px-2 py-2">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-text-muted hover:text-primary transition-colors py-1" href="#">
<span class="material-symbols-outlined text-[24px]">inbox</span>
<span class="text-[10px] font-medium tracking-wide">Inbox</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-text-muted hover:text-primary transition-colors py-1" href="#">
<span class="material-symbols-outlined text-[24px]">search</span>
<span class="text-[10px] font-medium tracking-wide">Search</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-text-muted hover:text-primary transition-colors py-1" href="#">
<span class="material-symbols-outlined text-[24px]">auto_awesome</span>
<span class="text-[10px] font-medium tracking-wide">Digest</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-1" href="#" style="color: #ffcb05;">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-bold tracking-wide">Account</span>
</a>
</div>
</nav>
</body></html>
