<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Collection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#ebe7e5",
                        "surface-dim": "#ddd9d7",
                        "inverse-primary": "#c7c8b5",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#584400",
                        "inverse-surface": "#31302f",
                        "tertiary-container": "#dae6dd",
                        "surface-container-highest": "#e5e2df",
                        "tertiary-fixed": "#d9e5dc",
                        "on-primary-fixed": "#1b1d11",
                        "on-surface-variant": "#474740",
                        "primary-fixed": "#e4e4d1",
                        "tertiary-fixed-dim": "#bdc9c1",
                        "on-tertiary-container": "#5c6760",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#ffe08d",
                        "on-background": "#1c1b1a",
                        "surface-variant": "#e5e2df",
                        "surface": "#fcf9f6",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#131e18",
                        "on-surface": "#1c1b1a",
                        "on-secondary-container": "#6f5700",
                        "surface-container-low": "#f7f3f0",
                        "on-secondary": "#ffffff",
                        "secondary": "#745b00",
                        "outline-variant": "#c8c7bd",
                        "secondary-fixed-dim": "#f2c000",
                        "secondary-container": "#ffcb09",
                        "on-primary-container": "#646657",
                        "surface-container": "#f1edea",
                        "on-primary": "#ffffff",
                        "surface-tint": "#5e5f51",
                        "primary-container": "#e4e4d1",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#241a00",
                        "background": "#fcf9f6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#56615a",
                        "surface-bright": "#fcf9f6",
                        "inverse-on-surface": "#f4f0ed",
                        "primary": "#745b00",
                        "outline": "#78776f",
                        "primary-fixed-dim": "#c7c8b5",
                        "on-primary-fixed-variant": "#46483a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="docked full-width top-0 sticky backdrop-blur-md no-line-rule bg-surface/90 dark:bg-surface-container-low/90 soft shadow-sm z-40">
<div class="flex justify-between items-center px-6 py-4 w-full">
<button class="scale-95 active:opacity-80 transition-all flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-headline-sm font-bold tracking-tight text-primary dark:text-secondary-fixed">
                Collection
            </h1>
<button class="font-label font-medium text-primary dark:text-secondary-fixed scale-95 active:opacity-80 transition-all px-3 py-2 rounded-lg hover:bg-surface-container-high dark:hover:bg-surface-dim transition-colors">
                Enregistrer
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="px-6 pt-4 space-y-6 max-w-2xl mx-auto w-full">
<!-- Search Bar -->
<div class="flex items-center bg-surface-container-high rounded-full px-5 py-3.5 shadow-[0_8px_24px_rgba(43,45,66,0.04)]">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="search">search</span>
<input class="w-full bg-transparent border-none outline-none focus:ring-0 text-on-surface placeholder:text-on-surface-variant ml-3 font-body text-base" placeholder="Rechercher" type="text">
</div>
<!-- Unsorted Card -->
<button class="w-full flex items-center justify-between bg-surface-container-high rounded-2xl px-5 py-4 shadow-[0_8px_24px_rgba(43,45,66,0.04)] hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="inbox">inbox</span>
<span class="font-headline font-semibold text-lg text-on-surface">Non trié</span>
</div>
<span class="font-body text-on-surface-variant font-medium">4</span>
</button>
<!-- Collections Section -->
<section class="pt-2">
<!-- Section Header -->
<div class="flex items-center justify-between mb-4 px-2">
<div class="flex items-center gap-2 cursor-pointer group">
<h2 class="font-headline text-xl font-bold tracking-tight text-on-surface group-hover:text-primary transition-colors">My collections</h2>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-90">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
<!-- Folders List Container -->
<div class="bg-surface-container-low rounded-3xl p-2 shadow-[0_8px_24px_rgba(43,45,66,0.04)]">
<!-- Item: Test parent -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Test parent</span>
</div>
<span class="font-body text-on-surface-variant text-sm">1</span>
</div>
<!-- Item: Collec2 (Expandable) -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Collec2</span>
</div>
<div class="flex items-center gap-3">
<span class="font-body text-on-surface-variant text-sm">1</span>
<span class="material-symbols-outlined text-primary text-xl" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<!-- Nested Item 1 -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1 ml-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-xl opacity-80" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Sous collec</span>
</div>
</div>
<!-- Divider approach without lines - using spacing -->
<div class="h-2"></div>
<!-- Item: Sous collec 2 (Expandable) -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Sous collec 2</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-xl" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<!-- Nested Item 2 -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1 ml-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-xl opacity-80" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Sous sous collec 2</span>
</div>
</div>
<div class="h-2"></div>
<!-- Item: Collection 3 -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Collection 3</span>
</div>
</div>
<!-- Item: Collection4 -->
<div class="flex items-center justify-between px-4 py-3.5 hover:bg-surface-container-high rounded-2xl cursor-pointer transition-colors group mt-1">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="folder" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body font-medium text-on-surface group-hover:text-primary transition-colors">Collection4</span>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->



</body></html>
