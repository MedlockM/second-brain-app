services:
  # Service API FastAPI
  api:
    profiles: [ "api", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:5173
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PODCASTS_TABLE=podcasts
      - EPISODES_TABLE=episodes
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      - AUTH_TOKENS_TABLE=auth_tokens
      # SQS Queues
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: uvicorn media_summarizer.api.main:app --host 0.0.0.0 --port 8000

  # Worker de résumé LLM
  summarize-worker:
    profiles: [ "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
      - EPISODE_COMPLETED_EVENTS_QUEUE=episode-completed-events
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.summarization.summarization_worker

  # Worker d'envoi d'emails
  email-worker:
    profiles: [ "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.notification.email_worker

  # Worker d'événements d'épisodes complétés (fan-out watchers)
  episode-events-worker:
    profiles: [ "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - EPISODE_COMPLETED_EVENTS_QUEUE=episode-completed-events
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.events.episode_completed_worker

  # Worker de génération de flashcards (artifact auto-generated post-transcript)
  flashcards-worker:
    profiles: [ "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      - FLASHCARDS_BUCKET=media-summarizer-flashcards
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      - MEDIA_ARTIFACTS_TABLE=media_artifacts
      - ARTIFACT_IDEMPOTENCE_TABLE=artifact_idempotence
      # SQS Queues
      - FLASHCARDS_QUEUE=flashcards-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.flashcards.worker

  # Lambda zip builder - builds the Lambda deployment package before Terraform runs
  lambda-builder:
    profiles: [ "infrastructure", "api", "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/lambda-builder.Dockerfile
    volumes:
      - .:/app:ro
      - ./infrastructure/terraform/localstack:/output
    restart: "no"

  # LocalStack pour simuler les services AWS (incluant DynamoDB)
  localstack:
    profiles: [ "infrastructure", "api", "workers", "full" ]
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,ses,dynamodb,lambda,iam,logs,events
      - DEBUG=1
      - EAGER_SERVICE_LOADING=1
      - SKIP_INFRA_DOWNLOADS=1
      - PERSISTENCE=1
      # Use local executor for faster Lambda execution in dev
      # (docker-reuse has issues with LocalStack Community)
      - LAMBDA_EXECUTOR=local
      - EDGE_PORT=4566
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localhost:4566
      - PROVIDER_OVERRIDE_S3=v2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack-data:/var/lib/localstack
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  terraform:
    profiles: [ "infrastructure", "api", "workers", "full" ]
    build:
      context: .
      dockerfile: infrastructure/docker/terraform.Dockerfile
    working_dir: /workspace
    volumes:
      - ./infrastructure/terraform/localstack:/workspace
    env_file:
      - .env.dev
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - TF_VAR_localstack_endpoint=http://localstack:4566
      - TF_VAR_podcastindex_api_key=${PODCASTINDEXORG_API_KEY}
      - TF_VAR_podcastindex_api_secret=${PODCASTINDEXORG_API_SECRET}
      - TF_VAR_spotify_client_id=${SPOTIFY_CLIENT_ID}
      - TF_VAR_spotify_client_secret=${SPOTIFY_CLIENT_SECRET}
    depends_on:
      localstack:
        condition: service_healthy
      lambda-builder:
        condition: service_completed_successfully
    restart: "no"
