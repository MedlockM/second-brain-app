services:
  # Service API FastAPI
  api:
    profiles: ["api", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:5173
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PODCASTS_TABLE=podcasts
      - EPISODES_TABLE=episodes
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      - AUTH_TOKENS_TABLE=auth_tokens
      - STRIPE_EVENTS_TABLE=stripe_events
      # SQS Queues
      - AUDIO_DOWNLOAD_QUEUE=audio-download-queue
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: uvicorn media_summarizer.api.main:app --host 0.0.0.0 --port 8000

  # Service de transcription Whisper
  whisper:
    profiles: ["whisper", "workers", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/whisper.Dockerfile
      args:
        - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-large} # From .env.dev; default to large for better accuracy
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # Force small model at runtime; build preloads via arg but runtime uses this
      - WHISPER_MODEL=small
      - ENVIRONMENT=development
      - SQS_MAX_MESSAGES=1
      - SQS_WAIT_TIME=1
      - SQS_VISIBILITY_TIMEOUT=120
      - SQS_HEARTBEAT_INTERVAL=60
      - ENABLE_FAST_POLLING=true
      - TEST_MODE=true
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - AUDIO_DOWNLOAD_QUEUE=audio-download-queue
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

  # Worker de téléchargement audio
  download-worker:
    profiles: ["workers", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - AUDIO_DOWNLOAD_QUEUE=audio-download-queue
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.download_worker

  # Worker de résumé LLM
  summarize-worker:
    profiles: ["workers", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - AUDIO_DOWNLOAD_QUEUE=audio-download-queue
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
      - EPISODE_COMPLETED_EVENTS_QUEUE=episode-completed-events
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.summarization.summarization_worker

  # Worker d'envoi d'emails
  email-worker:
    profiles: ["workers", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - AUDIO_DOWNLOAD_QUEUE=audio-download-queue
      - TRANSCRIPTION_QUEUE=transcription-queue
      - SUMMARIZATION_QUEUE=summarization-queue
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.notification.email_worker

  # Worker d'événements d'épisodes complétés (fan-out watchers)
  episode-events-worker:
    profiles: ["workers", "full"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      # S3 Buckets
      - AUDIO_BUCKET=media-summarizer-audio
      - TRANSCRIPT_BUCKET=media-summarizer-transcriptions
      - SUMMARY_BUCKET=media-summarizer-summaries
      # DynamoDB Tables
      - USERS_TABLE=users
      - PROCESSING_JOBS_TABLE=processing_jobs
      - CREDIT_TRANSACTIONS_TABLE=credit_transactions
      # SQS Queues
      - EPISODE_COMPLETED_EVENTS_QUEUE=episode-completed-events
      - NOTIFICATION_QUEUE=email-notification-queue
    depends_on:
      localstack:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    command: python -m media_summarizer.workers.events.episode_completed_worker

  # LocalStack pour simuler les services AWS (incluant DynamoDB)
  localstack:
    profiles: ["infrastructure", "api", "workers", "whisper", "full"]
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,ses,dynamodb
      - DEBUG=1
      - EAGER_SERVICE_LOADING=1
      - SKIP_INFRA_DOWNLOADS=1
      - PERSISTENCE=0
      - LAMBDA_EXECUTOR=local
      - EDGE_PORT=4566
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localhost:4566
      - PROVIDER_OVERRIDE_S3=v2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  terraform:
    profiles: ["infrastructure", "api", "workers", "full"]
    image: hashicorp/terraform:1.6.6
    working_dir: /workspace
    volumes:
      - ./infrastructure/terraform/localstack:/workspace
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - TF_VAR_localstack_endpoint=http://localstack:4566
    entrypoint: []
    command:
      [
        "/bin/sh",
        "-lc",
        "terraform init -upgrade && terraform validate && terraform plan -out=tfplan && terraform apply -auto-approve tfplan",
      ]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
